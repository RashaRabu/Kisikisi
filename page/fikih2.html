  <script>
    // Kisi-kisi pengelompokan bab sesuai halaman 1 dokumen
    const babMap = {
      jinayah: [2,3,7,10,13,15,21,22,29,30,36,46,52,54,60,62,68,70,76,78,84,86,92,94,100,102,108,110,114,116,118,124,126,131,132,134,137,139,140],
      hudud: [1,4,5,9,11,16,17,19,24,25,31,32,35,38,40,41,42,43,44,45,48,49,55,56,61,64,67,72,73,79,80,85,88,91,96,97,103,104,109,112,115,120,121,127,128,133,136,138],
      bughat: [6,12,18,23,28,34,39,51,57,63,69,75,81,87,93,99,105,111,117,123,129,135],
      qadha: [8,14,20,26,27,33,37,47,50,53,58,59,65,66,71,74,77,82,83,89,90,95,98,101,106,107,113,119,122,125,130,138]
    };

    function getBabInfo(no) {
      if (babMap.jinayah.includes(no)) return { key: 'jinayah', label: 'Jinayah', color: 'text-emerald-300 bg-emerald-500/10 border-emerald-500/25' };
      if (babMap.hudud.includes(no)) return { key: 'hudud', label: 'Hudud', color: 'text-sky-300 bg-sky-500/10 border-sky-500/25' };
      if (babMap.bughat.includes(no)) return { key: 'bughat', label: 'Bughat & Riddah', color: 'text-indigo-300 bg-indigo-500/10 border-indigo-500/25' };
      return { key: 'qadha', label: 'Peradilan Islam', color: 'text-purple-300 bg-purple-500/10 border-purple-500/25' };
    }

    // Format compact: [No, "Pertanyaan", ["A", "B", "C", "D", "E"], "KunciHuruf"]
    const rawQuestions = [
      [1, "Dalam hukum Islam, nisab pencurian ditetapkan sebesar 14 dinar. Jika harga emas saat ini Rp4.000.000 per gram, berapakah nilai minimal barang yang dicuri agar mencapai nisab pencurian?", ["Rp10.360.000", "Rp12.360.000", "Rp13.360.000", "Rp14.360.000", "Rp16.360.000"], "C"],
      [2, "Dalam sebuah pertandingan bela diri resmi yang telah memenuhi standar keselamatan, seorang atlet melancarkan tendangan sah sesuai aturan pertandingan. Namun, lawannya terjatuh dengan posisi kepala membentur sudut ring hingga meninggal dunia. Berdasarkan analisis fikih jinayah, peristiwa tersebut dikategorikan sebagai...", ["Qatl 'amdi karena tendangan dilakukan dengan niat melukai lawan", "Qatl syibhul 'amdi karena menggunakan anggota tubuh tanpa alat mematikan namun berujung kematian", "Qatl khata' karena tidak ada niat membunuh dan terjadi dalam aktivitas yang dibolehkan syariat", "Tindak pidana hirabah karena dilakukan di hadapan publik", "Perbuatan mubah yang tidak menimbulkan konsekuensi diyat maupun kafarat sama sekali"], "C"],
      [3, "Ahmad memukul tangan Budi hingga menyebabkan tangannya patah. Budi kemudian memaafkan Ahmad dan tidak menuntut balasan yang setimpal. Dalam fikih jinayah, sikap memaafkan tersebut dapat berpengaruh terhadap pelaksanaan qisas. Penyelesaian yang mungkin dilakukan adalah...", ["Ahmad tetap wajib dikenai qisas dalam semua keadaan", "Ahmad otomatis terbebas dari seluruh tanggung jawab", "Ahmad kemungkinan membayar diyat atau ganti rugi sesuai ketentuan", "Ahmad wajib membayar kafarat sumpah", "Ahmad wajib membayar Qisas dan kafarat"], "C"],
      [4, "Seseorang yang menuduh orang lain melakukan zina tanpa memiliki bukti yang dipercaya, maka wajib atasnya had qadzaf. Pelaksanaan had qadzaf menjadi boleh tidak dijalankan dengan syarat...", ["Maqdzuf memaafkan", "Maqdzuf adalah muhson", "Maqdzuf bukan orang tua tertuduh", "Maqdzuf mengakui perbuatannya", "Maqdzuf mempunyai 1 orang saksi"], "A"],
      [5, "Seorang pencuri membobol brankas besi di dalam rumah warga dan mengambil uang tunai senilai Rp25.000.000. Namun, sebelum kasusnya dilaporkan ke hakim dan sebelum ia tertangkap, pencuri tersebut sadar, bertaubat, dan mengembalikan seluruh uang tersebut secara diam-diam kepada pemiliknya. Menurut mayoritas ulama fikih, status hukum had potong tangan baginya adalah...", ["Tetap wajib dipotong tangannya karena unsur pencurian telah terpenuhi", "Gugur hukuman hadnya karena ia bertaubat dan mengembalikan barang sebelum perkara sampai ke hakim", "Diganti dengan hukuman dera 100 kali di hadapan umum", "Wajib membayar diyat sebesar dua kali lipat nilai uang yang dicuri", "Tetap dipotong tangan kirinya sebagai pelajaran bagi masyarakat"], "B"],
      [6, "Sekelompok orang menolak suatu kebijakan pemerintah. Mereka menyampaikan pendapat melalui media sosial dan mengadakan diskusi tanpa kekerasan. Seorang siswa menyimpulkan bahwa kelompok tersebut pasti melakukan bughat. Penilaian yang paling tepat terhadap kesimpulan siswa tersebut adalah...", ["Benar, sebab setiap penolakan terhadap kebijakan pemerintah termasuk bughat", "Benar, sebab perbedaan pendapat merupakan bentuk pemberontakan", "Salah, sebab kritik dan perbedaan pendapat secara damai tidak otomatis memenuhi pengertian bughat", "Benar, sebab semua kritik terhadap pemerintah harus dihukum", "Salah, sebab bughat hanya terjadi dalam persoalan ekonomi"], "C"],
      [7, "Membayar Diyat mughaladoh berupa 100 ekor unta, dengan rincian terdiri dari 30 ekor hiqqoh, 30 ekor jadza'ah dan 40 ekor khilfah, hal itu merupakan diyat untuk jenis qotlu 'amdi dan qotlu syibhul 'amdi. Berikut ini yang termasuk qotlu syibhul 'amdi adalah...", ["Seseorang sengaja memberikan racun ke dalam minuman temannya sehingga kehilangan nyawa.", "Seseorang yang berburu rusa, namun anak panahnya meleset mengenai seseorang yang berada di tempat tersebut, sehingga meninggal dunia.", "Seseorang yang menyekap orang lain dalam ruangan selama 3 hari tanpa diberi makan dan minum hingga meninggal dunia.", "Seseorang memberikan obat yang ternyata racun kepada orang sakit dan akhirnya meninggal dunia.", "Seseorang mendorong orang lain hingga jatuh di jurang dan meninggal dunia."], "D"],
      [8, "Saksi adalah orang yang diperlukan pengadilan untuk memberikan keterangan yang berkaitan dengan suatu perkara, demi tegaknya hukum dan tercapainya keadilan dalam pengadilan. Berikut ini adalah contoh kesaksian yang tidak dapat diterima, yaitu...", ["Seorang muslim bersaksi untuk mengungkap kebenaran kasus terhadap tetangganya yang juga muslim", "Seorang anak yang bersaksi untuk meringankan dakwaan terhadap ayah kandungnya", "Seorang wanita bersaksi atas pencurian yang dilakukan seorang laki-laki", "Orang yang jujur bersaksi atas kejahatan orang yang tidak dikenalnya", "Dua orang bersaksi di persidangan dengan menunjukan bukti"], "C"],
      [9, "Berdasarkan QS. An-Nur ayat 4, seseorang yang menuduh perempuan baik-baik melakukan zina tetapi tidak dapat menghadirkan empat saksi menghadapi konsekuensi tertentu. Pernyataan yang paling sesuai dengan ayat tersebut adalah...", ["Dikenai 40 kali dera dan wajib membayar diyat", "Dikenai 80 kali dera, kesaksiannya ditolak, dan disebut sebagai orang fasik dalam ketentuan ayat tersebut", "Dikenai 100 kali dera dan diasingkan selama satu tahun", "Dikenai qisas dan seluruh hartanya disita", "Hanya diwajibkan meminta maaf tanpa konsekuensi lain"], "B"],
      [10, "Jika seseorang membunuh dengan sengaja, maka hukumannya adalah qishas. Namun jika mendapatkan maaf, maka ia wajib membayar diyat berat (Diat Mughalladzah) dengan rincian berikut ini, kecuali...", ["30 ekor hiqqah", "40 ekor khilfah", "100 ekor unta", "30 ekor jadza'ah", "40 ekor binta labun"], "E"],
      [11, "Seorang pencuri tertangkap oleh satpam kemudian dibawa ke kantor polisi untuk diproses secara hukum, dan sudah terbukti mencuri barang bernilai melebihi nisabnya dan kejadian itu kali pertama ia mencuri. Menurut aturan ajaran agama Islam hukuman yang tepat untuk pencurian tersebut adalah...", ["Dipotong tangan kiri", "Dipotong tangan kanan", "Dipotong kedua tangannya", "Dipotong kaki kanan", "Dipotong kaki kiri"], "B"],
      [12, "Seorang pemuda bernama Hasan mengunggah video yang berisi pernyataan bahwa dirinya telah keluar dari agama Islam. Namun, setelah video tersebut tersebar, keluarganya menjelaskan bahwa video itu merupakan bagian dari adegan film yang sedang dibuat. Beberapa warga tetap menyebut Hasan sebagai orang murtad tanpa memeriksa kebenaran informasi tersebut. Berdasarkan kasus tersebut, tindakan yang paling tepat adalah...", ["Langsung menetapkan Hasan sebagai murtad karena videonya telah tersebar", "Menghukum Hasan berdasarkan keputusan warga setempat", "Memeriksa konteks, maksud, dan fakta yang sebenarnya sebelum memberikan penilaian", "Menganggap semua orang yang membuat video tentang riddah pasti murtad", "Membenarkan tuduhan warga karena video tersebut dapat dilihat oleh masyarakat"], "C"],
      [13, "Beni adalah pembela aktivis HAM yang sangat aktif membela hak-hak orang yang direnggut hak asasinya. Karena merasa terganggu terhadap apa yang dilakukan oleh Beni, pihak yang tidak bertanggung jawab pun meracuni Beni sehingga Beni meninggal dunia. Tindakan yang dilakukan terhadap aktivis HAM Beni dalam ilmu fikih disebut...", ["Pembunuhan terencana", "Pembunuhan sengaja", "Pembunuhan tidak sengaja", "Pembunuhan semi sengaja", "Pembunuhan tersalah"], "B"],
      [14, "Dalam sebuah persidangan kasus sengketa tanah wakaf, penggugat tidak mampu menghadirkan dua orang saksi yang adil. Tergugat kemudian diminta bersumpah oleh hakim untuk membantah gugatan tersebut, dan tergugat pun bersumpah atas nama Allah. Berdasarkan kaidah pembuktian dalam peradilan Islam (Al-Bayyinah 'alal mudda'i wal yamin 'ala man ankara), langkah hakim yang paling tepat adalah...", ["Memenangkan penggugat karena ia berani mengajukan gugatan terlebih dahulu", "Memenangkan tergugat karena penggugat gagal membawa bukti dan tergugat telah bersumpah", "Membagi tanah sengketa menjadi dua bagian yang sama rata untuk keduanya", "Menunda putusan selama sepuluh tahun hingga saksi baru muncul", "Menghukum penggugat dengan hukuman dera karena dianggap memfitnah"], "B"],
      [15, "Seorang ayah dengan sengaja membunuh anak kandungnya. Dalam pembahasan fikih jinayah menurut jumhur ulama, ayah tersebut tidak dikenai hukuman qisas. Berdasarkan kasus tersebut, alasan yang tepat adalah...", ["Setiap pembunuhan yang dilakukan oleh ayah terhadap anaknya dianggap sebagai pembunuhan yang tidak disengaja.", "Hubungan nasab antara ayah dan anak menjadi penghalang penerapan hukuman qisas menurut jumhur ulama dalam kasus tersebut.", "Seorang ayah memiliki hak untuk menentukan hidup dan mati anaknya.", "Hukuman qisas hanya berlaku bagi orang yang tidak memiliki hubungan keluarga.", "Seorang ayah yang membunuh anaknya terbebas dari seluruh konsekuensi hukum."], "B"],
      [16, "Seorang Muslim dewasa meminum khamar dengan sengaja dan tanpa paksaan. Dalam fikih jinayah, perbuatan tersebut termasuk jarimah yang dapat dikenai hukuman had. Namun, penetapan dan pelaksanaan hukumannya harus memenuhi ketentuan hukum yang berlaku. Jarimah tersebut disebut...", ["Jarimah qisas", "Jarimah diyat", "Jarimah hudud", "Jarimah bughat", "Jarimah riddah"], "C"],
      [17, "Dalam peristiwa penggerebekan di sebuah hotel didapati sepasang laki-laki dan perempuan yang berstatus bukan suami istri melakukan perzinaan, padahal keduanya berstatus menikah. Dalam Islam hukuman pelaku zina yang sudah menikah adalah...", ["Didera 50x dan diasingkan", "Diasingkan selama 1 thn", "Tidak dipercaya pernyataanya seumur hidup", "Didera 100x dan diasingkan", "Dirajam sampai mati"], "E"],
      [18, "Bughat adalah orang-orang yang menentang atau memberontak pemimpin negara yang terpilih secara sah. Tindakan yang dilakukan bughat bisa berupa memisahkan diri dari pemerintahan yang sah, membangkang perintah pemimpin, atau menolak berbagai kewajiban yang dibebankan kepada mereka. Orang-orang yang menentang pemimpin yang sah tidak akan mendapatkan hukuman apabila...", ["Mempunyai kekuatan, baik pengikut maupun senjata", "Mempunyai alasan kenapa mereka menentang imam", "Mempunyai pengikut yang setuju dengan mereka", "Mempunyai pemimpin yang ditaati", "Terdapat wilayah yang mereka kuasai"], "E"],
      [19, "Merampok, menyamun dan merompak merupakan kejahatan yang bersifat mengancam harta dan jiwa. Artinya merampok harta orang lain, dosanya bisa lebih besar dari dosa pencuri. Karena dalam praktik merampok harta ada unsur kekerasan. Seorang perampok yang merampas harta orang lain namun tidak membunuhnya, maka hukumannya adalah...", ["Dibunuh", "Dipenjara", "Dipotong tangan dan kakinya secara silang", "Dicambuk 50 kali", "Membayar kifarat"], "C"],
      [20, "Sesuai hadist yang diriwayatkan oleh Abu Daud dan Al-Hakim ada tiga golongan qodi yaitu...", ["Hakim yang mengetahui kebenaran dan menetapkan hukum berdasarkan kebenaran ia masuk surga", "Hakim yang mengetahui kebenaran dan menetapkan hukum bertentangan dengan kebenaran ia masuk neraka", "Hakim yang menetapkan hukum dengan kebodohannya ia masuk neraka", "Jawaban a, b, c benar", "Jawaban a, b, c salah"], "D"],
      [21, "Pak Wahyu adalah orang yang hobi berburu, suatu ketika ia sedang berburu seekor burung dengan menggunakan senapan anginnya, tapi pada suatu saat peluru Pak Wahyu tidak sengaja mengenai seseorang hingga meninggal. Maka secara hukum Islam, hukuman yang harus dijalankan oleh Pak Wahyu adalah...", ["Diyat Mugholazoh dan puasa 3 bulan", "Memerdekakan budak dan puasa 1 bulan", "Diyat Mukhafafah dan memberi makan 10 fakir miskin", "Membayar diyat mukhafafah (ringan) dan memerdekakan budak", "Tetap di Qishas"], "D"],
      [22, "Dalam Fikih telah diatur tentang hukuman praktik pembunuhan yang biasa dikenal dengan istilah qishas. Pelaksanaan hukuman qishas harus mengikuti ketentuan syara', diantaranya adalah...", ["Korban adalah orang yang tidak dilindungi darahnya", "Pelaku pidana belum aqil dan baligh", "Pelaku adalah orangtua atau keluarga korban", "Antara pelaku dan korban tidak sederajat", "Pembunuhannya dilakukan dengan sengaja"], "E"],
      [23, "Sekelompok orang tidak setuju dengan kebijakan pemerintah daerah. Awalnya, mereka menyampaikan protes melalui demonstrasi damai. Namun, beberapa anggota kelompok kemudian mengangkat senjata, menyerang aparat, dan berusaha melawan pemerintahan yang sah dengan kekuatan bersenjata. Berdasarkan konsep bughat dalam fikih jinayah, peristiwa yang paling relevan untuk dikaji sebagai bughat adalah...", ["Ketidaksetujuan terhadap kebijakan pemerintah", "Penyampaian pendapat melalui demonstrasi damai", "Kegiatan diskusi untuk mengkritik kebijakan pemerintah", "Tindakan pemberontakan bersenjata terhadap pemerintahan yang sah", "Penyampaian kritik melalui surat kepada pemerintah"], "D"],
      [24, "Rafi menuduh Hasan mencuri uang, sedangkan Hasan menuduh Rafi berzina. Keduanya tidak memiliki bukti atas tuduhan tersebut. Pernyataan yang paling tepat menurut fikih jinayah adalah...", ["Keduanya melakukan qadzaf karena sama-sama menuduh tanpa bukti", "Rafi melakukan qadzaf, sedangkan Hasan melakukan pencurian", "Hasan melakukan qadzaf, sedangkan tuduhan pencurian oleh Rafi bukan qadzaf", "Keduanya wajib dikenai had qadzaf sebanyak 80 kali dera", "Tidak dapat dikenai konsekuensi hukum karena tidak ada saksi"], "C"],
      [25, "Joni merampas secara paksa toko perhiasan di ujung pasar yang sepi sambil mengacungkan senjata. Ia mengancam korban agar menyerahkan perhiasan dan telepon genggamnya. Setelah mendapatkan barang tersebut dan membunuh korban, Joni melarikan diri. Tentukan had apa yang pantas diberikan kepada Joni sesuai dengan ketentuan agama Islam...", ["Dibunuh dan disalib", "Dibunuh", "Dicambuk", "Dirajam", "Dipotong tangan dan kaki"], "A"],
      [26, "Barang bukti dalam ilmu fikih (hukum-hukum pengadilan) disebut juga dengan...", ["Qadha", "Iqrar", "Syahadah", "Qhadi", "Al-Bayyinah"], "E"],
      [27, "Penggugat dalam istilah peradilan islam lazim disebut...", ["Al Bayyinah", "Muddai 'alaih", "Mahkum 'alaih", "Muddai", "Mahkum bih"], "D"],
      [28, "Dalam penanganan kelompok yang dikategorikan sebagai bughat, langkah awal yang sesuai dengan prinsip QS. Al-Hujurat ayat 9 adalah...", ["Langsung menjatuhkan hukuman mati kepada seluruh anggota kelompok", "Mengupayakan perdamaian dan mencari penyebab perselisihan", "Menghukum keluarga para anggota kelompok", "Mengambil seluruh harta milik kelompok tersebut", "Melarang masyarakat memberikan keterangan"], "B"],
      [29, "Dalam pengadilan seorang terdakwa terbukti telah melakukan pembunuhan berencana kepada temannya, dalam bentuk sengaja mencampurkan racun ke dalam minuman hingga berakibat meninggal, maka bentuk hukuman untuk tindak pidana pembunuhan tersebut dalam ajaran Islam berupa...", ["Dipenjara sampai mati", "Diqishas dengan cara dihukum mati", "Dipotong tangan dan membayar diyat", "Dihukum seumur hidup dan membayar diyat", "Dipenjara dan diasingkan dengan waktu yang tak terbatas"], "E"],
      [30, "Seseorang yang membunuh dengan sengaja, namun ia dimaafkan oleh keluarga korban, maka ia wajib membayar diyat. Yang dimaksud diyat adalah...", ["Harta yang harus diberikan kepada keluarga korban sebagai ganti tindak kejahatan", "Permintaan maaf kepada keluarga korban", "Jaminan kepada keluarga korban bahwa tidak akan mengulang lagi", "Perjanjian dengan keluarga akan menanggung biaya seumur hidup", "Jaminan kepada ulama bahwa ia sudah bertaubat"], "A"],
      [31, "Had bagi seorang anak yang mencuri harta ayahnya adalah...", ["Potong tangannya", "Tidak dipotong tangan tetapi terkena ta'zir", "Dera 80 kali", "Dera 100 kali", "Tarhib"], "B"],
      [32, "Dalam fikih jinayah, seseorang dapat dikenai had zina apabila memenuhi syarat-syarat yang telah ditetapkan syariat. Berikut ini yang merupakan syarat seseorang dapat dikenai had zina adalah...", ["Balig, berakal, melakukan zina atas kehendak sendiri, dan terbukti sesuai ketentuan syariat", "Dewasa, sudah menikah, dan mengakui perbuatannya di depan keluarga", "Berakal, belum menikah, dan dituduh oleh dua orang saksi", "Balig, kaya, dan melakukan hubungan dengan lawan jenis", "Berakal, memiliki pekerjaan, dan tinggal bersama pasangannya"], "A"],
      [33, "Ahmad bersumpah atas nama Allah bahwa ia tidak akan berbicara dengan temannya selama satu bulan. Namun, sebelum satu bulan berlalu, Ahmad menyadari bahwa sumpah tersebut justru memperburuk hubungan mereka. Ia akhirnya berbicara kembali dengan temannya. Kafarat yang harus ditunaikan Ahmad sesuai ketentuan kafarat sumpah adalah...", ["Berpuasa selama tiga hari tanpa pilihan lain", "Memberi makan sepuluh orang miskin, memberi pakaian kepada mereka, atau memerdekakan seorang budak; jika tidak mampu, berpuasa tiga hari", "Berpuasa selama dua bulan berturut-turut", "Memberi makan enam puluh orang miskin", "Membayar fidyah sebesar satu mud kepada sepuluh orang miskin"], "B"],
      [34, "Perhatikan dua peristiwa berikut! Peristiwa I: Seseorang yang sebelumnya beragama Islam secara sadar menyatakan keluar dari Islam. Peristiwa II: Sekelompok orang melakukan pemberontakan bersenjata terhadap pemerintahan yang sah. Berdasarkan konsep fikih jinayah, pasangan istilah yang tepat untuk kedua peristiwa tersebut adalah...", ["Peristiwa I adalah bughat, sedangkan Peristiwa II adalah riddah.", "Peristiwa I adalah riddah, sedangkan Peristiwa II adalah bughat.", "Peristiwa I adalah pencurian, sedangkan Peristiwa II adalah riddah.", "Peristiwa I adalah qadzaf, sedangkan Peristiwa II adalah pencurian.", "Peristiwa I dan Peristiwa II sama-sama disebut riddah."], "B"],
      [35, "Budi mencuri sebuah laptop seharga Rp15.000.000. Jika nisab pencurian sebesar 3,34 gram emas dan harga emas Rp4.000.000 per gram, kelebihan nilai barang yang dicuri dari nisab adalah...", ["Rp640.000", "Rp1.000.000", "Rp1.360.000", "Rp1.640.000", "Rp2.640.000"], "D"],
      [36, "Empat orang secara bersama-sama mengeroyok seorang warga menggunakan balok kayu dan besi hingga korban meninggal dunia di tempat kejadian. Dalam persidangan, keempatnya berdalih bahwa mereka tidak bisa diqishas karena korban hanya satu orang sedangkan pelakunya empat orang. Analisis hukum Islam yang tepat terhadap kasus pembunuhan berkelompok (qatl al-jama'ah bil wahid) menurut jumhur ulama adalah...", ["Keempat pelaku tidak dapat diqishas, melainkan hanya wajib membagi rata pembayaran satu diyat", "Hanya pelaku yang memukul terakhir kali yang wajib diqishas, sementara tiga lainnya dibebaskan", "Keempat pelaku tetap wajib dikenai hukuman qishas mati seluruhnya apabila keluarga korban tidak memaafkan", "Keempat pelaku hanya dikenai hukuman pengasingan selama satu tahun dan kafarat puasa", "Hukuman qishas gugur secara otomatis karena tidak adanya kesepadanan jumlah antara pelaku dan korban"], "C"],
      [37, "Seorang hakim (qadhi) sedang memimpin sidang sengketa waris. Di tengah persidangan, ia merasa sangat lapar, mengantuk berat, dan baru saja bertengkar hebat dengan keluarganya sehingga emosinya tidak stabil. Berdasarkan adab dan etika qadhi dalam peradilan Islam, tindakan yang wajib dilakukan hakim tersebut adalah...", ["Tetap memutus perkara secepat mungkin agar persidangan segera selesai", "Menyerahkan keputusan sepenuhnya kepada panitera pengadilan tanpa memeriksa bukti", "Menunda persidangan dan tidak menjatuhkan vonis sampai kondisi fisik dan emosinya kembali tenang", "Mengundi siapa yang menang di antara penggugat dan tergugat agar tampak adil", "Memenangkan pihak yang paling tenang dalam menyampaikan argumen di persidangan"], "C"],
      [38, "Menurut pendapat yang menyatakan bahwa hukuman bagi peminum khamar adalah 40 kali dera, hukuman tersebut didasarkan pada praktik yang diriwayatkan dari...", ["Khalifah Abu Bakar", "Khalifah Umar bin Khattab", "Khalifah Utsman bin Affan", "Khalifah Ali bin Abi Thalib", "Khalifah Muawiyah bin Abi Sufyan"], "A"],
      [39, "Balasan yang akan diterima oleh orang-orang munafik ketika di akhirat adalah...", ["Mendapatkan pengampunan dari Allah", "Siksa di dalam neraka paling bawah", "Siksa neraka paling atas", "Siksa neraka tengah-tengah", "Antara surga dan neraka"], "B"],
      [40, "Ahmad menuduh Zaid melakukan zina secara terang-terangan di hadapan masyarakat. Ketika diminta membuktikan tuduhannya, Ahmad tidak mampu menghadirkan empat orang saksi. Menurut ketentuan fikih jinayah, perbuatan Ahmad termasuk qazaf. Hukuman had qazaf yang disebutkan dalam QS. An-Nur ayat 4 adalah...", ["Dicambuk 40 kali dan kesaksiannya tetap diterima", "Dicambuk 60 kali dan diasingkan selama satu tahun", "Dicambuk 80 kali, kesaksiannya tidak diterima, dan ia termasuk orang fasik", "Dicambuk 100 kali dan diasingkan selama satu tahun", "Dipenjara selama enam bulan dan membayar diyat"], "C"],
      [41, "Dalam bab Perampokan had bagi mereka sesuai dengan surah Al-Maidah ayat 33, lalu para ulama sepakat bahwa hukumannya bersifat tahyiri. Apa yang dimaksud tahyiri...", ["Memilih diantara beberapa macam hukuman", "Memilih terkena sangsi had atau tidak", "Memilih diantara sangsi had atau ta'zir", "Macam hukuman disesuaikan dengan perbuatan yang dilakukan", "Macam hukum disesuaikan dengan status orang yang melakukan"], "D"],
      [42, "Seseorang mencuri uang sebesar Rp13.000.000. Jika harga emas Rp4.000.000 per gram, berdasarkan nisab 3,34 gram emas, status nilai barang yang dicuri adalah...", ["Melebihi nisab sebesar Rp360.000", "Tepat mencapai nisab", "Belum mencapai nisab karena kurang Rp360.000", "Belum mencapai nisab karena kurang Rp1.360.000", "Melebihi nisab sebesar Rp1.360.000"], "C"],
      [43, "Status hukuman bagi perampok yang bertaubat sebelum tertangkap yaitu...", ["Hak Allah Swt gugur atas mereka namun tidak gugur hak hamba", "Hak hamba gugur namun hak Allah Swt tidak gugur", "Hak Allah Swt dan hak hamba gugur atas mereka", "Hak Allah Swt dan hak hamba tidak gugur", "Hak hamba gugur seluruhnya"], "A"],
      [44, "Terdapat perbedaan pendapat ulama mengenai jumlah hukuman dera bagi peminum khamar. Pernyataan yang tepat adalah...", ["Seluruh ulama sepakat menetapkan 100 kali dera", "Seluruh ulama sepakat menetapkan 80 kali dera", "Sebagian ulama menetapkan 40 kali dera, sedangkan pendapat lain menetapkan 80 kali dera", "Seluruh ulama sepakat bahwa peminum khamar tidak dapat dihukum", "Hukuman peminum khamar selalu berupa hukuman mati"], "C"],
      [45, "Salah satu ditetapkannya syariat adalah untuk menjaga jiwa dan harta manusia, merampok adalah tindakan merampas jiwa dan atau merampas harta orang lain yang had nya sangat berat walaupun hanya sebatas menakut-nakuti, adapun had untuk orang yang sengaja menakut-nakuti korban adalah...", ["Dibunuh", "Dipotong tangannya", "Dipenjara atau tagrib", "Disalib", "Dipotong tangan dan kakinya secara menyilang"], "C"],
      [46, "Dalam sebuah pertengkaran hebat, Khalid memukul wajah Zayd hingga dua buah gigi seri Zayd tanggal permanen. Apabila Zayd menolak memaafkan dan menuntut pembalasan setimpal melalui jalur peradilan Islam yang sah, syarat utama agar hukuman qishas anggota tubuh (qishas fima dunan nafs) dapat dilaksanakan adalah...", ["Gigi Khalid dicabut tanpa mempertimbangkan risiko infeksi atau kerusakan saraf rahang", "Terdapat kesamaan jenis dan letak anggota tubuh serta aman dari risiko melampaui batas (istifa' bil ma'ruf)", "Khalid harus membayar diyat penuh terlebih dahulu sebelum giginya dicabut", "Pelaksanaan pencabutan gigi dilakukan langsung oleh Zayd di luar pengadilan", "Khalid boleh mengganti qishas giginya dengan memotong jari kelingkingnya"], "B"],
      [47, "Dalam sebuah sidang perdata, pihak tergugat menolak seluruh tuduhan penggugat namun tidak memiliki bukti tertulis, sedangkan penggugat hanya memiliki satu orang saksi laki-laki yang adil. Menurut ketentuan fikih peradilan (qadha) pada kasus sengketa harta benda, mekanisme pembuktian yang dapat ditempuh penggugat untuk menguatkan gugatannya adalah...", ["Gugatan langsung ditolak karena saksi wajib berjumlah empat orang laki-laki", "Satu orang saksi laki-laki tersebut dapat digabungkan dengan sumpah penggugat (syahid wa yamin)", "Hakim wajib menghukum tergugat berdasarkan firasat semata", "Penggugat harus membayar sejumlah uang kepada hakim agar gugatannya diterima", "Kesaksian satu orang laki-laki cukup untuk memutus perkara pidana hudud maupun perdata"], "B"],
      [48, "Seorang pria yang telah bercerai (tsayyib) terbukti secara sah melakukan perzinaan dengan seorang gadis lajang (bikr) atas dasar suka sama suka. Dalam penerapan hukum hudud Islam, keputusan hakim yang tepat terhadap kedua pelaku tersebut adalah...", ["Keduanya sama-sama dirajam hingga meninggal dunia karena perbuatan dilakukan bersama", "Keduanya sama-sama didera 100 kali dan diasingkan selama satu tahun", "Pria tersebut dijatuhi hukuman rajam, sedangkan gadis lajang didera 100 kali dan diasingkan satu tahun", "Pria tersebut didera 100 kali, sedangkan gadis lajang dibebaskan karena belum menikah", "Keduanya wajib dinikahkan paksa sebagai pengganti hukuman had"], "C"],
      [49, "Seorang tukang parkir mengambil sepeda motor milik pengunjung yang diparkir di pinggir jalan tanpa kunci ganda dan tidak dijaga di tempat tertutup (hirz). Jika nilai sepeda motor tersebut melebihi nisab pencurian, analisis fikih jinayah mengenai sanksi bagi pelaku tersebut adalah...", ["Wajib dipotong tangan kanannya karena nilai barang melebihi seperempat dinar", "Tidak dikenai had potong tangan melainkan hukuman ta'zir, karena barang tidak berada di tempat penyimpanan semestinya (hirz)", "Wajib dipotong tangan dan kakinya secara bersilang karena termasuk hirabah", "Dikenai hukuman dera 80 kali di halaman masjid", "Bebas dari segala sanksi karena kelalaian sepenuhnya berada pada pemilik motor"], "B"],
      [50, "Seorang hakim menjatuhkan vonis berdasarkan iqrar (pengakuan) terdakwa dalam kasus pencurian. Namun, sebelum eksekusi potong tangan dijalankan, terdakwa mencabut kembali pengakuannya dan menyatakan bahwa ia mengaku karena tertekan. Sikap hakim yang paling sesuai dengan prinsip fikih peradilan dalam perkara huququllah (hak Allah/hudud) adalah...", ["Tetap mengeksekusi potong tangan karena pengakuan awal tidak dapat ditarik kembali", "Menerima pencabutan pengakuan tersebut dan menggugurkan had potong tangan karena muncul unsur keraguan (syubhat)", "Melipatgandakan hukuman potong tangan menjadi kedua tangan sekaligus", "Menghukum terdakwa dengan hukuman rajam karena berbohong di persidangan", "Memaksa terdakwa mengulang pengakuannya di bawah ancaman senjata"], "B"],
      [51, "Sebuah kelompok bersenjata menduduki kantor pemerintahan provinsi, menguasai kas daerah, dan menolak tunduk kepada kepala negara yang sah dengan alasan memiliki penafsiran politik sendiri (ta'wil). Pemerintah telah mengirim utusan untuk berdialog dan meluruskan kesalahpahaman mereka, namun kelompok tersebut tetap menolak berdamai dan justru menembaki utusan pemerintah. Langkah hukum yang sah diambil pemerintah menurut fikih siyasah adalah...", ["Membiarkan kelompok tersebut mendirikan negara bagian sendiri demi menghindari konflik", "Memerangi mereka hingga mereka kembali tunduk kepada pemerintahan yang sah, tanpa merampas harta keluarga mereka sebagai ghanimah", "Menjadikan anak dan istri anggota kelompok tersebut sebagai tawanan perang dan budak", "Membunuh seluruh anggota kelompok yang telah menyerah dan meletakkan senjata", "Menyita seluruh harta pribadi warga sipil yang tinggal di wilayah kelompok tersebut"], "B"],
      [52, "Seseorang mengendarai mobil dalam keadaan mengantuk berat di jalan raya yang ramai hingga kehilangan kendali, menabrak pejalan kaki di trotoar, dan menyebabkan korban meninggal dunia. Apabila keluarga korban memaafkan pelaku dan tidak menuntut diyat, kewajiban agama yang tetap melekat pada diri pengemudi tersebut sebagai bentuk tanggung jawab spiritual kepada Allah Swt. adalah...", ["Tidak ada kewajiban apa pun karena keluarga korban sudah memaafkan", "Memerdekakan seorang hamba sahaya mukmin, atau jika tidak mampu wajib berpuasa dua bulan berturut-turut sebagai kafarat", "Membayar zakat mal sebesar 2,5% dari harga mobil yang dikendarainya", "Melaksanakan ibadah haji badal untuk almarhum korban", "Berpuasa tiga hari berturut-turut dan memberi makan sepuluh orang miskin"], "B"],
      [53, "Dalam perkara perdata yang menyangkut hak anak Adam (seperti kasus utang-piutang atau ganti rugi kerusakan barang), tergugat telah mengakui (iqrar) di depan sidang bahwa ia memang berutang kepada penggugat. Keesokan harinya tergugat ingin mencabut pengakuannya tersebut. Ketentuan hukum peradilan Islam dalam kasus ini adalah...", ["Pencabutan pengakuan diterima sehingga utang tergugat otomatis lunas", "Pencabutan pengakuan tidak diterima karena menyangkut hak sesama manusia (huququl 'ibad) yang telah tetap dengan pengakuan sah", "Perkara harus diulang dari awal dengan menghadirkan sepuluh orang saksi", "Penggugat wajib membayar denda karena tergugat mencabut pengakuannya", "Hakim membatalkan seluruh berita acara persidangan sebelumnya"], "B"],
      [54, "Dua orang pemuda terlibat perkelahian. Pemuda A memukul lengan Pemuda B hingga lumpuh permanen. Setahun kemudian, sebelum pelaksanaan qishas dilakukan, lengan Pemuda A mengalami kecelakaan lalu lintas sehingga lumpuh total dengan sendirinya. Dalam kajian fikih jinayah, konsekuensi hukum yang berlaku terhadap Pemuda A adalah...", ["Lengan Pemuda A yang sudah lumpuh tetap wajib diamputasi hingga bahu", "Pelaksanaan qishas pada lengan gugur karena objek qishas telah tiada/rusak, dan beralih kepada kewajiban membayar diyat anggota tubuh", "Pemuda A wajib dibunuh sebagai pengganti kelumpuhan lengan Pemuda B", "Pemuda A bebas dari qishas maupun pembayaran diyat karena sudah tertimpa musibah", "Pemuda B berhak memotong kaki Pemuda A sebagai pengganti tangannya"], "B"],
      [55, "Sekelompok perampok mencegat bus antarkota di jalan tol yang sepi. Mereka menodongkan senjata tajam kepada seluruh penumpang dan merampas uang serta perhiasan mereka, namun tidak ada satu pun penumpang yang dilukai hingga meninggal dunia. Menurut ketentuan QS. Al-Ma'idah ayat 33 dan jumhur ulama, sanksi had yang dijatuhkan kepada para perampok tersebut adalah...", ["Dibunuh dan disalib di tempat umum selama tiga hari", "Dipotong tangan kanan dan kaki kiri secara bersilang", "Diasingkan ke daerah terpencil selama enam bulan", "Dicambuk sebanyak 80 kali dan diwajibkan berpuasa", "Dibebaskan setelah mengembalikan barang hasil rampasan"], "B"],
      [56, "Seorang suami menuduh istrinya telah berbuat zina dengan pria lain, namun suami tersebut tidak mampu menghadirkan empat orang saksi di pengadilan. Untuk membela kehormatannya sekaligus menghindari had qadzaf 80 kali dera, syariat Islam memberikan jalan keluar khusus bagi pasangan suami istri tersebut yang disebut dengan istilah...", ["Zihar", "Ila'", "Li'an", "Khulu'", "Fasakh"], "C"],
      [57, "Seorang warga negara Muslim secara terang-terangan menyatakan keluar dari Islam dan menghina ajaran agama di ruang publik. Sebelum eksekusi hukuman riddah dijatuhkan oleh pengadilan syariah yang sah, langkah wajib (istitabah) yang harus ditempuh oleh hakim atau ulama adalah...", ["Langsung menjatuhkan hukuman mati pada detik itu juga tanpa dialog", "Memberi kesempatan bertaubat, berdialog meluruskan syubhat pemikirannya selama masa tenggang tertentu (umumnya 3 hari)", "Mengusir keluarganya dari wilayah negara agar tidak menularkan pemikirannya", "Merampas seluruh harta warisan keluarganya untuk kas negara", "Memaksanya mengucapkan syahadat di bawah ancaman penyiksaan fisik"], "B"],
      [58, "Dalam sistem peradilan Islam, tidak semua orang memenuhi syarat untuk diangkat menjadi seorang qadhi (hakim). Apabila seorang penguasa mengangkat seseorang yang buta kedua matanya atau tuli total sebagai hakim utama di pengadilan umum, menurut jumhur ulama pengangkatan tersebut berstatus...", ["Sah dan mengikat karena keadilan hanya dinilai dari kecerdasan hati", "Tidak sah karena kemampuan melihat dan mendengar merupakan syarat mutlak agar hakim dapat mengenali pihak berperkara dan memeriksa bukti", "Sah khusus untuk menangani perkara pidana pembunuhan berencana", "Makruh namun seluruh keputusannya tetap wajib dieksekusi", "Boleh dilakukan asalkan hakim tersebut didampingi oleh keluarga terdakwa"], "B"],
      [59, "Seorang perempuan memberikan kesaksian sendirian dalam kasus sengketa persusuan (radha'ah) dan kelahiran bayi di sebuah desa terpencil, di mana hanya perempuan tersebut yang menyaksikan proses persalinan secara langsung. Menurut pendapat mayoritas ulama fikih peradilan, status kesaksian perempuan tersebut adalah...", ["Ditolak mentah-mentah karena saksi harus selalu dua orang laki-laki", "Diterima sebagai alat bukti sah karena menyangkut perkara khusus wanita yang umumnya tidak disaksikan laki-laki", "Diterima hanya jika perempuan tersebut membayar sejumlah jaminan harta", "Ditolak kecuali jika ia bersumpah sebanyak lima puluh kali (qasamah)", "Dianggap sebagai kesaksian palsu yang diancam hukuman ta'zir"], "B"],
      [60, "Seseorang menggali sumur yang sangat dalam di tengah jalan umum yang gelap tanpa memasang tanda peringatan atau penutup. Pada malam hari, seorang pejalan kaki terperosok ke dalam sumur tersebut dan meninggal dunia. Dalam fikih jinayah, jenis pembunuhan ini disebut qatl bis-sabab (pembunuhan tidak langsung) yang hukumannya disamakan dengan...", ["Qatl 'amdi yang mewajibkan hukuman qishas mati bagi penggali sumur", "Qatl khata' yang mewajibkan pembayaran diyat ringan (mukhaffafah) oleh 'aqilah (keluarga besar) pelaku", "Hirabah yang mewajibkan hukuman salib", "Bughat karena merusak fasilitas jalan umum", "Perbuatan tidak bersalah karena pejalan kaki tidak membawa lampu penerangan"], "B"],
      [61, "Seorang remaja berusia 14 tahun yang belum balig ikut bersama komplotan orang dewasa membobol sebuah toko emas dan mengambil perhiasan senilai Rp50.000.000. Dalam persidangan, hakim memutuskan menjatuhkan had potong tangan kepada para pelaku dewasa, sementara terhadap remaja 14 tahun tersebut hakim menjatuhkan hukuman...", ["Potong tangan kiri karena usianya sudah mendekati dewasa", "Potong tangan kanan seperti pelaku dewasa demi keadilan hukum", "Tidak dijatuhi had potong tangan karena belum mukallaf (balig), melainkan diberikan pembinaan/hukuman ta'zir yang mendidik", "Dera 100 kali di hadapan kedua orang tuanya", "Diyat penuh sebesar 100 ekor unta yang ditanggung teman-temannya"], "C"],
      [62, "Seorang pria dengan sengaja memotong kedua daun telinga korbannya hingga putus permanen, namun korban tidak meninggal dunia. Keluarga korban menolak qishas dan memilih menuntut diyat. Berapakah besaran diyat yang wajib dibayarkan pelaku atas hilangnya kedua daun telinga korban?", ["Seperempat diyat penuh (25 ekor unta)", "Setengah diyat penuh (50 ekor unta)", "Satu diyat penuh (100 ekor unta) karena menyangkut sepasang anggota tubuh yang memiliki fungsi dan keindahan lengkap", "Sepertiga diyat penuh (33 ekor unta)", "Sepuluh ekor unta betina bunting"], "C"],
      [63, "Sekelompok masyarakat menolak membayar zakat kepada amil resmi negara karena menganggap pengelolaannya tidak transparan, namun mereka tidak mengangkat senjata, tidak membentuk pasukan, dan tetap mengakui kedaulatan kepala negara yang sah. Dalam tinjauan fikih, sikap kelompok tersebut dikategorikan sebagai...", ["Riddah kolektif yang menghalalkan darah seluruh anggotanya", "Bughat bersenjata yang wajib langsung diperangi oleh tentara negara", "Pembangkangan administratif/maksiat yang diselesaikan melalui pembinaan, pengawasan transparan, atau sanksi ta'zir, bukan diperangi sebagai bughat", "Hirabah karena menahan hak fakir miskin", "Qadzaf karena menuduh amil tidak amanah"], "C"],
      [64, "Empat orang saksi hadir di persidangan untuk memberikan kesaksian atas kasus perzinaan yang dituduhkan kepada seseorang. Tiga saksi pertama memberikan kesaksian yang sama persis mengenai waktu, tempat, dan kejadiannya. Namun, saksi keempat ragu-ragu dan menyatakan tidak melihat kejadian secara jelas. Konsekuensi hukum dari peristiwa persidangan tersebut adalah...", ["Terdakwa tetap dihukum rajam karena tiga saksi sudah mencukupi mayoritas", "Terdakwa dibebaskan dari had zina, sedangkan keempat saksi tersebut dikenai had qadzaf (80 kali dera) karena kesaksian tidak lengkap empat orang", "Saksi keempat saja yang dicambuk 80 kali, sedangkan terdakwa dipenjara", "Hakim menyuruh terdakwa bersumpah 50 kali untuk menggugurkan kesaksian tiga orang tersebut", "Terdakwa dikenai hukuman setengah dari had zina"], "B"],
      [65, "Dalam suatu persidangan, hakim mengetahui bahwa salah satu pihak yang berperkara adalah keponakan kandungnya sendiri yang sering dibantunya secara finansial. Agar putusan pengadilan tetap objektif dan terhindar dari konflik kepentingan, langkah yang paling tepat menurut etika peradilan Islam adalah...", ["Melanjutkan sidang dan memenangkan keponakannya secara halus", "Mengundurkan diri dari pemeriksaan perkara tersebut dan menyerahkannya kepada hakim lain yang netral", "Memenangkan pihak lawan secara otomatis agar terlihat tidak memihak keluarga", "Meminta keponakannya mencabut gugatan di luar jam sidang", "Menunda sidang hingga keponakannya selesai mempersiapkan bukti tambahan"], "B"],
      [66, "Seorang penggugat mengajukan tuntutan kepemilikan kebun kelapa sawit seluas 5 hektare yang selama 20 tahun terakhir dikuasai dan dikelola secara terbuka oleh tergugat. Penggugat tidak memiliki dokumen, saksi, maupun bukti apa pun, sementara tergugat memiliki sertifikat sah dan saksi tetangga kebun. Dalam kaidah peradilan Islam, posisi tergugat yang menguasai barang secara sah (yad) dan didukung bukti kuat berhak atas...", ["Kewajiban menyerahkan separuh kebun kepada penggugat sebagai uang damai", "Penetapan hak milik penuh atas kebun tersebut dan penolakan terhadap gugatan yang tanpa bukti", "Hukuman ta'zir karena tidak mau berbagi lahan dengan penggugat", "Kewajiban membayar ganti rugi selama 20 tahun pengelolaan kebun", "Pencabutan hak kepemilikan sampai penggugat menemukan saksi"], "B"],
      [67, "Seseorang mengonsumsi minuman beralkohol dalam jumlah sangat sedikit dengan alasan sekadar menghangatkan badan di daerah pegunungan yang dingin, dan ia sama sekali tidak sampai mabuk atau kehilangan kesadaran. Menurut kaidah fikih jinayah (ma askara katsiruhu faqaliluhu haram), status hukum perbuatan dan sanksinya adalah...", ["Mubah dan bebas sanksi karena tujuannya untuk pengobatan/penghangat tubuh", "Makruh dan hanya dinasihati oleh tokoh masyarakat", "Tetap haram dan pelakunya tetap dikenai sanksi had khamar apabila terbukti meminumnya dengan sengaja", "Halal selama tidak mengganggu ketertiban umum di lingkungannya", "Hanya dikenai kewajiban membayar kafarat memberi makan orang miskin"], "C"],
      [68, "Seorang dokter bedah yang memiliki kompetensi dan izin praktik resmi melakukan operasi jantung terhadap pasien atas persetujuan pasien dan keluarganya. Di tengah operasi yang telah dijalankan sesuai prosedur medis terbaik, pasien mengalami henti jantung mendadak dan meninggal dunia. Dalam analisis fikih jinayah, dokter tersebut...", ["Wajib diqishas mati karena pasien meninggal di meja operasinya", "Wajib membayar diyat mughalladzah dari harta pribadinya", "Terbebas dari tuntutan qishas maupun diyat karena bertindak atas izin sah dan sesuai keahlian/prosedur medis (ihsan)", "Wajib berpuasa dua bulan berturut-turut sebagai kafarat", "Dikenai had hirabah karena menggunakan alat tajam terhadap pasien"], "C"],
      [69, "Seseorang yang beragama Islam tetap melaksanakan salat dan puasa di hadapan masyarakat, tetapi secara sembunyi-sembunyi ia bekerja sama dengan musuh untuk menghancurkan umat Islam dan mendustakan kebenaran Al-Qur'an di dalam hatinya. Dalam terminologi akidah dan fikih, sifat orang tersebut disebut...", ["Nifaq 'amali (munafik perbuatan ringan)", "Nifaq i'tiqadi (munafik akidah/besar) yang mengeluarkan pelakunya dari Islam secara hakiki", "Fasik ringan akibat kelalaian beribadah", "Bughat terhadap pemimpin daerah", "Murtad secara lisan (qauli)"], "B"],
      [70, "Seorang laki-laki membunuh seorang perempuan secara sengaja (qatl 'amdi). Menurut pendapat jumhur ulama (Malikiyah, Syafi'iyah, dan Hanabilah), apakah laki-laki tersebut dapat dijatuhi hukuman qishas mati atas pembunuhan terhadap perempuan tersebut?", ["Tidak dapat diqishas karena diyat perempuan separuh dari diyat laki-laki", "Tetap wajib diqishas mati karena kemuliaan nyawa laki-laki dan perempuan setara dalam hukum qishas (QS. Al-Ma'idah: 45)", "Hanya wajib membayar separuh diyat tanpa qishas", "Diqishas hanya jika dibantu oleh dua orang laki-laki lainnya", "Diganti dengan hukuman penjara seumur hidup di pengasingan"], "B"],
      [71, "Dalam proses pembuktian di pengadilan Islam, seorang saksi yang diajukan penggugat ternyata diketahui masyarakat sering berbohong, gemar berjudi, dan meninggalkan salat wajib secara terang-terangan. Sikap hakim terhadap kesaksian orang tersebut adalah...", ["Menerima kesaksiannya asalkan ia bersumpah di atas mushaf Al-Qur'an", "Menolak kesaksiannya karena tidak memenuhi syarat 'adalah (integritas moral dan ketaatan beragama)", "Menerima kesaksiannya dengan nilai setengah dari saksi normal", "Meminta terdakwa memaafkan perilaku saksi terlebih dahulu", "Menjadikan kesaksiannya sebagai dasar utama penjatuhan hukuman hudud"], "B"],
      [72, "Seorang pria belum menikah (ghairu muhshan) mengaku secara jujur dan sadar di hadapan hakim sebanyak empat kali dalam majelis berbeda bahwa dirinya telah berbuat zina. Namun, setelah hakim menjatuhkan vonis dera 100 kali dan cambukan baru berjalan 20 kali, pria tersebut berteriak mencabut pengakuannya dan menyatakan dirinya tidak berzina. Menurut jumhur ulama, tindakan algojo dan hakim adalah...", ["Melanjutkan cambukan hingga genap 100 kali karena vonis sudah diketok", "Menghentikan pelaksanaan cambukan seketika karena pencabutan pengakuan dalam kasus hudud menimbulkan syubhat yang menggugurkan sisa had", "Menambah hukuman cambuk menjadi 120 kali karena dianggap mempermainkan sidang", "Mengganti sisa cambukan dengan hukuman rajam", "Memenjara pria tersebut sampai ia mengakui perbuatannya kembali"], "B"],
      [73, "Seseorang mencuri sebuah kotak amal di teras masjid yang tidak dikunci dan tidak dijaga oleh petugas keamanan. Nilai uang di dalam kotak amal tersebut setara dengan 5 gram emas. Menurut pendapat mayoritas ulama fikih (termasuk mazhab Syafi'i dan Hanafi), pelaku tersebut tidak dikenai hukuman potong tangan melainkan hukuman ta'zir, dengan alasan utama...", ["Uang kotak amal adalah milik umum (syubhatul milk) dan tidak disimpan di tempat penjagaan tertutup (hirz)", "Nilai 5 gram emas belum mencapai batas minimal nisab pencurian", "Pencurian yang dilakukan di lingkungan masjid otomatis dimaafkan syariat", "Pelaku melakukannya karena desakan kebutuhan ekonomi sehari-hari", "Hukuman potong tangan hanya berlaku untuk pencurian emas batangan"], "A"],
      [74, "Seseorang bersumpah atas nama Allah untuk tidak akan pernah masuk ke rumah saudaranya lagi karena kesalahpahaman. Setelah didamaikan oleh tokoh masyarakat, ia menyadari bahwa memutus silaturahmi adalah perbuatan dosa. Berdasarkan hadis Nabi Saw. (\"Barang siapa bersumpah atas suatu perkara lalu melihat ada hal lain yang lebih baik darinya, maka hendaklah ia mengerjakan yang lebih baik itu dan membayar kafarat sumpahnya\"), langkah yang harus ia tempuh adalah...", ["Tetap mempertahankan sumpahnya seumur hidup agar tidak berdosa melanggar sumpah", "Mengunjungi rumah saudaranya untuk menyambung silaturahmi dan menunaikan kafarat sumpah", "Membatalkan sumpahnya dengan cara berpuasa dua bulan berturut-turut", "Membayar diyat 10 ekor unta kepada saudaranya sebagai tanda perdamaian", "Meminta hakim membatalkan sumpahnya tanpa perlu membayar kafarat"], "B"],
      [75, "Sekelompok warga mengadakan aksi unjuk rasa di depan kantor DPRD dengan membawa spanduk tuntutan penurunan harga kebutuhan pokok. Mereka berorasi secara tertib, tidak membawa senjata, tidak merusak fasilitas umum, dan bubar setelah aspirasi diterima. Apabila aparat langsung menangkap mereka dengan tuduhan melakukan bughat, penilaian hukum Islam terhadap tindakan aparat tersebut adalah...", ["Tepat, karena segala bentuk protes di depan kantor pemerintah adalah bughat", "Keliru, karena aksi tersebut tidak memenuhi unsur bughat yaitu penggunaan kekuatan bersenjata (syaukah) dan upaya makar menggulingkan pemerintahan sah", "Tepat, karena masyarakat dilarang mengkritik kebijakan ekonomi penguasa", "Keliru, karena seharusnya mereka langsung dihukum sebagai pelaku hirabah", "Tepat, apabila aksi unjuk rasa diikuti lebih dari seratus orang"], "B"],
      [76, "Seseorang melemparkan batu besar dari atas atap bangunan ke arah jalan raya yang ramai tanpa melihat kondisi di bawahnya, hingga batu tersebut menimpa kepala seorang pengendara motor dan menyebabkannya meninggal dunia. Dilihat dari sifat alat dan perbuatannya yang biasanya mematikan namun tanpa niat membunuh orang tertentu, jumhur ulama mengkategorikan kasus ini ke dalam...", ["Qatl khata' murni", "Qatl syibhul 'amdi (pembunuhan semi sengaja) yang mewajibkan diyat mughalladzah", "Qatl 'amdi yang mewajibkan qishas mati", "Pembunuhan tidak langsung (qatl bis-sabab) yang bebas diyat", "Kecelakaan lalu lintas biasa yang tidak dikenai kafarat"], "B"],
      [77, "Dalam sebuah persidangan perkara utang-piutang, penggugat mengajukan dua orang saksi laki-laki yang dikenal adil. Namun, pihak tergugat berhasil membuktikan di depan hakim bahwa kedua saksi tersebut memiliki permusuhan pribadi ('adawah dunyawiyyah) yang sengit dengan tergugat akibat sengketa warisan masa lalu. Keputusan hakim yang paling tepat adalah...", ["Tetap menerima kesaksian keduanya karena mereka beragama Islam dan berakal sehat", "Menolak kesaksian keduanya karena permusuhan pribadi dapat merusak objektivitas kesaksian (tuhmah)", "Meminta kedua saksi bersumpah bahwa mereka tidak membenci tergugat", "Menghukum tergugat agar berdamai terlebih dahulu dengan kedua saksi", "Memenangkan penggugat tanpa mempertimbangkan keberatan tergugat"], "B"],
      [78, "Seorang korban penganiayaan berat yang kehilangan penglihatan mata kanannya memutuskan untuk memaafkan pelaku secara tulus tanpa menuntut qishas maupun menuntut pembayaran diyat sepeser pun. Dalam ajaran fikih jinayah, konsekuensi hukum dari sikap pemaafan mutlak korban tersebut adalah...", ["Pelaku tetap wajib dipotong mata kanannya demi menegakkan wibawa hukum", "Gugurnya kewajiban qishas dan kewajiban pembayaran diyat bagi pelaku, meskipun hakim tetap berwenang menjatuhkan sanksi ta'zir demi kemaslahatan umum", "Pelaku wajib membayar diyat kepada negara sebagai pengganti hak korban", "Korban berdosa karena telah menyia-nyiakan hak hukum yang diberikan Allah kepadanya", "Pelaku wajib berpuasa dua bulan berturut-turut sebagai ganti diyat"], "B"],
      [79, "Seorang pengedar minuman keras memproduksi dan menjual khamar secara massal di lingkungannya, meskipun ia sendiri tidak meminumnya. Berdasarkan prinsip maqashid syariah (menjaga akal/hifzhul 'aql) dan konsep ta'zir dalam fikih jinayah, sanksi yang dijatuhkan hakim kepada produsen dan pengedar tersebut adalah...", ["Dibiarkan bebas karena had khamar hanya berlaku bagi orang yang meminumnya", "Dikenai hukuman ta'zir yang berat (seperti penyitaan/pemusnahan barang, denda, dan penjara) karena turut merusak akal masyarakat", "Dikenai hukuman qishas mati secara langsung", "Dikenai had qadzaf 80 kali dera", "Diwajibkan membayar zakat perdagangan dari hasil penjualan khamar tersebut"], "B"],
      [80, "Seseorang menuduh sekelompok warga di suatu kampung melakukan perbuatan zina secara massal tanpa bukti apa pun (\"Kalian semua penduduk kampung ini adalah pezina\"). Menurut pendapat mayoritas ulama fikih, hukuman had qadzaf yang dijatuhkan kepada penuduh tersebut adalah...", ["Didera 80 kali dikalikan dengan jumlah seluruh penduduk kampung tersebut", "Didera sebanyak satu kali had qadzaf (80 kali dera) karena tuduhan dilontarkan dalam satu ucapan/peristiwa sekaligus", "Dibebaskan dari had qadzaf karena tuduhan tidak ditujukan kepada nama individu tertentu", "Didera 40 kali dan diasingkan ke luar negeri", "Wajib meminta maaf secara tertulis di balai desa tanpa hukuman cambuk"], "B"],
      [81, "Seseorang yang telah balig dan berakal sehat dipaksa oleh kelompok teroris bersenjata dengan ancaman pembunuhan langsung jika ia tidak mau mengucapkan kalimat kekufuran. Dalam kondisi terancam nyawanya, ia mengucapkan kalimat tersebut secara lisan sementara hatinya tetap teguh beriman kepada Allah dan Rasul-Nya. Berdasarkan QS. An-Nahl ayat 106, status keimanan dan hukum riddah bagi orang tersebut adalah...", ["Ia otomatis menjadi murtad karena kalimat kekufuran telah terucap dari lisannya", "Ia tidak dihukumi murtad dan tidak berdosa karena dalam kondisi terpaksa (ikrah mulji') dengan hati yang tetap beriman", "Ia dihukumi murtad sementara dan wajib memperbarui syahadat serta menikah ulang", "Ia wajib dikenai hukuman ta'zir karena tidak memilih mati syahid", "Status keimanannya tergantung pada penilaian masyarakat sekitar"], "B"],
      [82, "Dalam sistem peradilan Islam, seorang qadhi dilarang keras menerima hadiah, bingkisan, atau jamuan makan istimewa dari salah satu pihak yang sedang berperkara di pengadilannya, meskipun pihak tersebut beralasan bahwa hadiah itu adalah sedekah biasa. Hikmah utama dari larangan ini dalam peradilan Islam adalah...", ["Agar hakim tidak mengalami kelebihan harta yang mewajibkan zakat", "Menutup celah suap (risywah) dan menjaga independensi serta netralitas hakim dalam memutus perkara", "Karena hadiah dari masyarakat hukumnya haram mutlak bagi seluruh pegawai negara", "Agar pihak lawan tidak merasa iri dan ikut memberikan hadiah yang lebih mahal", "Untuk menghemat anggaran biaya operasional pengadilan agama"], "B"],
      [83, "Seseorang mengajukan gugatan di pengadilan agar tetangganya dihukum karena diduga berniat jahat di dalam hatinya untuk mencuri buah mangga di kebunnya, meskipun tetangga tersebut belum melakukan tindakan apa pun. Hakim menolak gugatan tersebut. Prinsip fikih peradilan yang mendasari penolakan hakim adalah...", ["Peradilan Islam hanya mengadili perbuatan lahiriah dan bukti nyata (nahnu nahkumu biz-zhawahir), bukan niat tersembunyi di dalam hati", "Pencurian buah-buahan di kebun terbuka tidak termasuk perkara peradilan", "Hakim hanya berwenang mengadili perkara yang nilainya di atas satu dinar", "Gugatan terhadap tetangga tidak boleh diajukan sebelum tiga kali peringatan", "Niat jahat di dalam hati hanya bisa dibuktikan melalui sumpah li'an"], "A"],
      [84, "Seorang ibu yang sedang tidur terlelap tanpa sengaja berguling dan menindih bayi mungilnya hingga bayi tersebut kehabisan napas dan meninggal dunia. Dalam tinjauan fikih jinayah, kasus tragis ini termasuk dalam kategori...", ["Qatl 'amdi yang mewajibkan hukuman mati bagi sang ibu", "Qatl khata' (pembunuhan tersalah/tidak sengaja) yang mewajibkan kafarat dan diyat ringan yang ditanggung oleh 'aqilah", "Qatl syibhul 'amdi yang mewajibkan diyat mughalladzah", "Kejahatan hirabah terhadap anggota keluarga", "Peristiwa yang tidak memiliki konsekuensi kafarat maupun diyat"], "B"],
      [85, "Seorang pegawai bendahara perusahaan membawa kabur uang kas perusahaan sebesar Rp100.000.000 yang memang diamanahkan kepadanya untuk disimpan dan dikelola (khianat/penggelapan). Dalam kajian fikih jinayah menurut jumhur ulama, hukuman yang tepat bagi pegawai tersebut adalah...", ["Dipotong tangan kanannya karena nilai uang jauh melampaui nisab pencurian", "Tidak dijatuhi had potong tangan karena ia mengambil harta yang berada dalam penguasaan amanahnya (ikhtilas/khianat), melainkan dijatuhi hukuman ta'zir berat dan wajib mengembalikan uang tersebut", "Dipotong tangan dan kakinya secara bersilang", "Dikenai had qadzaf 80 kali dera", "Dibebaskan dari tuntutan hukum karena kesalahan pimpinan perusahaan yang mempercayainya"], "B"],
      [86, "Dalam pembayaran diyat mukhaffafah (diyat ringan) atas kasus pembunuhan tidak sengaja (qatl khata'), pembayarannya tidak dibebankan seluruhnya kepada harta pribadi pelaku seorang diri, melainkan dipikul bersama oleh 'aqilah (keluarga besar dari garis ayah/asabah pelaku) dan dapat diangsur selama tiga tahun. Hikmah sosial di balik ketentuan ini adalah...", ["Agar pelaku dapat mengulangi perbuatannya tanpa takut bangkrut", "Meringankan beban finansial pelaku yang tidak berniat membunuh sekaligus menumbuhkan solidaritas dan tanggung jawab sosial keluarga besar untuk saling menjaga perilaku anggotanya", "Menghukum seluruh anggota keluarga pelaku agar ikut merasakan penderitaan penjara", "Menghilangkan hak ahli waris korban untuk menerima santunan secara utuh", "Menggantikan fungsi zakat mal bagi keluarga pelaku"], "B"],
      [87, "Seseorang yang telah murtad dan dijatuhi putusan hukum oleh pengadilan akhirnya menyatakan bertaubat dengan tulus, kembali mengucapkan dua kalimat syahadat, dan memperbaiki amal ibadahnya. Menurut ajaran Islam, status hukum dan konsekuensi baginya di dunia dan akhirat adalah...", ["Taubatnya tidak diterima Allah Swt. karena dosa murtad tidak dapat diampuni", "Taubatnya diterima Allah Swt., gugur hukuman mati atas dirinya di dunia, dan ia kembali memperoleh hak serta kewajibannya sebagai seorang Muslim", "Ia tetap wajib dihukum mati terlebih dahulu baru kemudian taubatnya diterima", "Ia diterima kembali sebagai Muslim namun selamanya dilarang melaksanakan salat berjamaah", "Ia wajib membayar diyat sebesar 100 ekor unta kepada baitul mal"], "B"],
      [88, "Dalam pelaksanaan hukuman had zina maupun qadzaf berupa cambukan (dera), syariat Islam menetapkan tata cara pelaksanaan yang sangat terukur, yaitu menggunakan cambuk berukuran sedang, tidak memukul bagian wajah, kepala, dan kemaluan, serta tidak memukul satu titik tubuh secara terus-menerus. Tujuan syariat menetapkan aturan teknis tersebut adalah...", ["Agar terpidana tidak merasakan sakit sama sekali saat dicambuk", "Karena tujuan utama had adalah memberi efek jera dan pelajaran (zajr wa ta'dib), bukan menyiksa hingga menyebabkan kematian pada pidana yang tidak diancam hukuman mati", "Untuk mempercepat durasi waktu pelaksanaan hukuman di lapangan", "Agar terpidana dapat langsung melarikan diri setelah dicambuk", "Karena algojo dilarang menggunakan tenaga penuh dalam menjalankan tugasnya"], "B"],
      [89, "Dalam suatu persidangan, pihak penggugat dan tergugat sama-sama mengajukan alat bukti kepemilikan yang tampak seimbang (ta'arudh al-bayyinat), dan tidak ada satu pun yang dapat diunggulkan. Dalam kondisi kebuntuan pembuktian semacam ini, langkah penyelesaian yang dianjurkan dalam fikih peradilan Islam adalah...", ["Hakim membatalkan hukum Islam dan menggunakan undian koin", "Hakim mengupayakan perdamaian (ishlah) di antara kedua belah pihak secara adil dan proporsional", "Hakim menyita barang sengketa untuk menjadi milik pribadi hakim", "Hakim menghukum keduanya dengan hukuman penjara sampai salah satu mengalah", "Hakim memenangkan pihak yang status sosialnya lebih tinggi di masyarakat"], "B"],
      [90, "Seseorang yang menjadi saksi di pengadilan terbukti memberikan kesaksian palsu (syahadatuz-zur) untuk menjerumuskan orang yang tidak bersalah ke dalam hukuman pidana. Setelah kebohongannya terbongkar sebelum eksekusi dijalankan, sanksi yang dijatuhkan hakim kepada saksi palsu tersebut menurut fikih peradilan adalah...", ["Diberi peringatan lisan tanpa catatan hukum", "Dijatuhi hukuman ta'zir yang berat (seperti dera, diumumkan ke publik agar masyarakat tidak lagi mempercayai kesaksiannya, dan dipenjara)", "Wajib menggantikan posisi penggugat dalam persidangan berikutnya", "Dikenai kewajiban membayar zakat fitrah dua kali lipat", "Diminta bersumpah ulang agar kesaksiannya tetap berlaku"], "B"],
      [91, "Seorang kepala keluarga mencuri bahan makanan pokok di toko kelontong pada masa paceklik dan kelaparan hebat yang melanda negerinya demi menyelamatkan nyawa anak-anaknya yang hampir mati kelaparan. Merujuk pada kebijakan Khalifah Umar bin Khattab r.a. pada tahun paceklik ('Am ar-Ramadah), keputusan hukum Islam yang tepat adalah...", ["Tetap memotong tangan kepala keluarga tersebut agar tidak ditiru warga lain", "Menangguhkan/menggugurkan had potong tangan karena adanya unsur darurat (syubhatul hajah/idhthirar) untuk menyelamatkan nyawa", "Menghukum pemilik toko karena tidak membagikan makanannya secara gratis", "Mengganti potong tangan dengan hukuman rajam", "Memotong jari telunjuk pelaku sebagai bentuk keringanan hukum"], "B"],
      [92, "Dua orang pekerja bangunan sedang bekerja di lantai lima sebuah gedung. Pekerja A bermaksud melempar palu besi ke arah tempat peralatan, namun karena kurang hati-hati palu tersebut terlepas dan jatuh tepat mengenai kepala Pekerja B di lantai dasar hingga meninggal dunia. Klasifikasi pembunuhan ini adalah...", ["Qatl 'amdi karena menggunakan palu besi yang merupakan benda keras mematikan", "Qatl khata' karena tidak ada unsur kesengajaan mengarahkan pukulan kepada korban sama sekali", "Qatl syibhul 'amdi karena dilakukan di lingkungan proyek bangunan", "Hirabah karena menyebabkan hilangnya nyawa pekerja lain", "Pembunuhan berencana tingkat pertama"], "B"],
      [93, "Mengapa dalam fikih siyasah Islam, harta benda milik kaum bughat yang berhasil dilumpuhkan oleh pemerintahan yang sah tidak boleh dirampas sebagai ghanimah (harta rampasan perang) dan tawanan mereka yang terluka tidak boleh dibunuh?", ["Karena kaum bughat memiliki kekuatan militer yang lebih besar daripada negara", "Karena kaum bughat masih berstatus sebagai saudara sesama Muslim dan warga negara yang tujuan penindakannya hanyalah untuk mengembalikan mereka ke jalan ketaatan, bukan membinasakan mereka", "Karena harta kaum bughat biasanya tidak memiliki nilai ekonomis", "Karena pemerintahan yang sah dilarang memiliki pasukan bersenjata", "Karena seluruh kaum bughat otomatis masuk surga tanpa hisab"], "B"],
      [94, "Seseorang melukai wajah orang lain dengan pisau hingga menimbulkan luka robek yang memanjang dan menampakkan tulang (mudhihah). Apabila korban menuntut qishas, hakim dapat melaksanakan qishas luka (qishas fij-jirah) pada bagian tersebut dengan syarat...", ["Luka dapat diukur panjang, lebar, dan kedalamannya secara presisi tanpa risiko melampaui batas hingga mematikan pelaku", "Pelaku harus membayar diyat penuh terlebih dahulu baru kemudian dilukai", "Korban sendiri yang menorehkan pisau ke wajah pelaku secara emosional", "Luka berada di bagian leher atau dada yang dekat dengan organ vital", "Pelaku berusia di bawah lima belas tahun"], "A"],
      [95, "Dalam suatu persidangan, hakim menjatuhkan putusan yang didasarkan pada ijtihad yang sah sesuai dalil Al-Qur'an dan Sunnah. Beberapa tahun kemudian, hakim tersebut meninjau kasus serupa dan menemukan hasil ijtihad baru yang lebih kuat. Bagaimana status putusan hakim yang telah dijatuhkan pada masa lalu tersebut menurut kaidah fikih peradilan (al-ijtihad la yunqadhu bil-ijtihad)?", ["Putusan masa lalu wajib dibatalkan seluruhnya dan diulang dari awal", "Putusan masa lalu tetap sah dan mengikat, sedangkan ijtihad baru diterapkan untuk perkara-perkara yang akan datang", "Hakim tersebut wajib dipecat karena dianggap tidak konsisten dalam berijtihad", "Pihak yang kalah pada sidang masa lalu berhak menuntut ganti rugi kepada hakim", "Kedua hasil ijtihad tersebut dinyatakan batal demi hukum"], "B"],
      [96, "Seorang wanita Muslimah yang sedang hamil dinyatakan terbukti secara sah melakukan perzinaan muhshan berdasarkan pengakuannya sendiri. Berdasarkan teladan Rasulullah Saw. dalam kasus wanita Ghamidiyah, waktu pelaksanaan hukuman had rajam terhadap wanita tersebut adalah...", ["Dilaksanakan seketika saat itu juga agar dosa segera terhapus", "Ditunda hingga ia melahirkan kandungannya dan selesai masa penyusuan/penyapihan bayinya hingga ada yang mengasuh bayi tersebut", "Diganti dengan hukuman dera 10 kali karena sedang mengandung", "Dibatalkan selamanya karena kehamilan menggugurkan seluruh hukuman hudud", "Dilaksanakan setelah anak tersebut berusia balig"], "B"],
      [97, "Seorang pencuri yang telah dipotong tangan kanannya pada pencurian pertama kembali melakukan pencurian harta yang mencapai nisab untuk kedua kalinya. Menurut jumhur ulama (Malikiyah, Syafi'iyah, dan Hanabilah), sanksi had yang dijatuhkan pada pencurian kedua ini adalah...", ["Dipotong tangan kirinya", "Dipotong kaki kirinya (bersilang dengan tangan kanan yang telah dipotong)", "Dipotong kaki kanannya", "Dicambuk 100 kali dan dipenjara", "Dibunuh dan disalib"], "B"],
      [98, "Seorang warga mengajukan gugatan perdata terhadap seorang pejabat tinggi negara di pengadilan Islam. Ketika sidang dimulai, pejabat tersebut datang terlambat dan meminta duduk di kursi kehormatan di samping hakim, sementara rakyat biasa duduk di lantai bawah. Tindakan hakim yang sesuai dengan prinsip keadilan peradilan Islam (taswiyah bainal khashmain) adalah...", ["Mempersilakan pejabat duduk di samping hakim demi menghormati jabatannya", "Memerintahkan pejabat tersebut duduk sejajar dengan penggugat di tempat yang sama tanpa pembedaan perlakuan sedikit pun", "Menunda sidang sampai rakyat biasa mencabut gugatannya terhadap pejabat", "Memberikan waktu bicara dua kali lebih lama kepada pejabat tersebut", "Memeriksa perkara secara tertutup di rumah dinas pejabat tersebut"], "B"],
      [99, "Seseorang secara sadar meyakini dan menyatakan bahwa setelah Nabi Muhammad Saw. masih ada nabi baru yang menerima wahyu syariat dari Allah Swt., meskipun ia tetap mengaku beragama Islam dan melaksanakan salat. Menurut kesepakatan ulama fikih, hukum keyakinan dan pernyataan tersebut adalah...", ["Bagian dari perbedaan mazhab fikih yang harus ditoleransi", "Termasuk perbuatan riddah (kemurtadan) karena mengingkari pokok ajaran Islam yang pasti (ma'lum minad-din bidh-dharurah) tentang kenabian terakhir Nabi Muhammad Saw.", "Hanya merupakan kesalahan pemahaman sejarah yang tidak berpengaruh pada akidah", "Termasuk kategori bughat terhadap ulama", "Perbuatan makruh yang cukup diselesaikan dengan istigfar"], "B"],
      [100, "Seseorang menyewa pembunuh bayaran untuk menghabisi nyawa saingan bisnisnya. Pembunuh bayaran tersebut melaksanakan tugasnya dengan menembak korban hingga tewas. Menurut pendapat jumhur ulama (Malikiyah, Syafi'iyah, dan Hanabilah), pihak yang wajib dikenai hukuman qishas mati dalam kasus pembunuhan dengan perantara ini adalah...", ["Hanya pembunuh bayaran yang menembak langsung, sedangkan penyewa bebas", "Hanya penyewa yang merencanakan, sedangkan pembunuh bayaran bebas", "Keduanya (penyewa maupun pembunuh bayaran) sama-sama dikenai hukuman qishas mati apabila terbukti bersekongkol secara sadar", "Keduanya hanya dikenai hukuman pengasingan selama lima tahun", "Penyewa membayar diyat, sedangkan pembunuh bayaran dipotong tangannya"], "C"],
      [101, "Dalam peradilan Islam, seorang penggugat tidak diperbolehkan mengajukan gugatan atas suatu benda atau hak yang sama sekali tidak jelas jenis, ukuran, maupun batas-batasnya (misalnya: \"Saya menggugat dia karena telah mengambil sesuatu milik saya yang berharga\"). Syarat sah gugatan yang dilanggar dalam kasus tersebut adalah...", ["Gugatan harus diajukan oleh orang yang sudah menikah", "Ma'lum (objek yang digugat harus jelas dan teridentifikasi dengan pasti)", "Penggugat harus didampingi oleh empat orang saksi ahli", "Tergugat harus berasal dari kota yang sama dengan penggugat", "Gugatan harus ditulis dalam bahasa Arab klasik"], "B"],
      [102, "Seorang pembunuh sengaja (qatl 'amdi) mendapatkan pengampunan dari seluruh ahli waris korban sehingga ia terbebas dari hukuman qishas mati dan beralih wajib membayar diyat mughalladzah sebesar 100 ekor unta. Kapan dan oleh siapa diyat mughalladzah dalam kasus pembunuhan sengaja ini wajib dibayarkan?", ["Dibayar tunai (kontan) dari harta pribadi pelaku sendiri tanpa ditanggung oleh 'aqilah", "Diangsur selama lima tahun dan ditanggung oleh baitul mal negara", "Diangsur selama tiga tahun oleh keluarga besar ('aqilah) pelaku", "Dibayarkan setelah pelaku meninggal dunia dari harta warisannya", "Dibayar oleh pemerintah daerah tempat terjadinya pembunuhan"], "A"],
      [103, "Seseorang mencuri barang milik orang lain dari dalam rumah yang terkunci, namun barang tersebut adalah minuman keras (khamar) dan daging babi milik seorang Muslim. Dalam kajian fikih jinayah, apakah pencuri tersebut dikenai hukuman had potong tangan?", ["Wajib dipotong tangannya karena tetap mengambil barang orang lain secara sembunyi-sembunyi", "Tidak dikenai had potong tangan karena khamar dan babi bukan harta yang bernilai dan diakui kepemilikannya dalam syariat Islam (mal mutaqawwim) bagi seorang Muslim", "Dipotong tangan kirinya karena nilai barangnya tinggi di pasaran", "Dikenai had hirabah karena masuk ke rumah orang lain", "Wajib mengganti harga khamar dan babi tersebut secara tunai"], "B"],
      [104, "Seorang pemuda yang belum menikah terbukti berzina berdasarkan kesaksian empat orang saksi yang adil. Hakim menjatuhkan hukuman dera 100 kali dan pengasingan (taghrib) selama satu tahun ke daerah yang jauh dari tempat tinggalnya. Hikmah utama dari syariat pengasingan (taghrib) selama satu tahun bagi pelaku zina ghairu muhshan adalah...", ["Memutus hubungan pelaku dengan lingkungan lama yang memicu kemaksiatan sekaligus melindunginya dari cemoohan sosial yang menghambat taubatnya", "Agar pelaku dapat mencari pasangan baru di daerah pengasingan", "Untuk mengurangi kepadatan penduduk di kota asal pelaku", "Sebagai pengganti biaya denda yang tidak mampu dibayar pelaku", "Agar pelaku tidak perlu melaksanakan ibadah wajib selama satu tahun"], "A"],
      [105, "Sekelompok pemberontak bersenjata (bughat) berhasil menguasai sebuah kota selama beberapa bulan dan memungut pajak/zakat dari penduduk kota tersebut untuk membiayai pemerintahan mereka. Setelah pemberontakan berhasil dipadamkan secara damai oleh pemerintah yang sah, penduduk kota menuntut agar mereka tidak ditagih zakat ulang oleh pemerintah sah. Keputusan yang tepat menurut fikih siyasah (merujuk pada kebijakan Khalifah Ali bin Abi Thalib r.a.) adalah...", ["Penduduk wajib membayar zakat ulang karena zakat yang diserahkan kepada bughat tidak sah", "Zakat yang telah dipungut oleh kelompok bughat dianggap sah dan menggugurkan kewajiban penduduk sehingga tidak boleh ditagih dua kali", "Penduduk kota dihukum karena telah menyerahkan zakat kepada pemberontak", "Pemerintah menyita seluruh sisa harta penduduk kota sebagai ganti rugi", "Seluruh penduduk kota dinyatakan murtad karena tunduk kepada bughat"], "B"],
      [106, "Seorang terdakwa dalam kasus pidana pencurian tetap bungkam dan menolak menjawab pertanyaan hakim di persidangan, sementara penggugat tidak memiliki saksi maupun bukti fisik apa pun. Menurut fikih peradilan Islam, apakah sikap diam terdakwa dapat langsung dianggap sebagai pengakuan (iqrar) bersalah?", ["Ya, diamnya terdakwa otomatis menjadi bukti kuat untuk memotong tangannya", "Tidak, karena dalam perkara hudud tidak berlaku hukum nukul (penolakan bersumpah/diam) sebagai dasar penjatuhan had; terdakwa dibebaskan karena ketiadaan bukti", "Ya, dan hukumannya dilipatgandakan menjadi dua kali lipat", "Tidak, namun hakim berhak menyiksa terdakwa sampai ia mau berbicara", "Ya, asalkan penggugat bersumpah sebanyak sepuluh kali"], "B"],
      [107, "Dalam Islam, jabatan sebagai qadhi (hakim) memiliki tanggung jawab dunia dan akhirat yang sangat berat. Apabila di suatu wilayah terdapat seseorang yang memiliki kompetensi keilmuan fikih dan integritas moral terbaik, sementara tidak ada orang lain yang layak menggantikannya sehingga hak-hak masyarakat terancam terbengkalai jika ia menolak, maka hukum menerima jabatan hakim baginya adalah...", ["Haram mutlak karena dikhawatirkan masuk neraka", "Makruh yang sebaiknya dihindari dengan cara melarikan diri", "Wajib (fardhu 'ain) demi menegakkan keadilan dan melindungi hak-hak masyarakat", "Mubah tanpa nilai pahala sedikit pun", "Sunah muakkad khusus bagi orang yang sudah berusia lanjut"], "C"],
      [108, "Seseorang bermaksud menakut-nakuti temannya yang mengidap penyakit jantung kronis dengan cara menyamar sebagai hantu dan menyergapnya secara tiba-tiba di ruang gelap, padahal ia mengetahui kondisi penyakit temannya tersebut. Akibat terkejut hebat, temannya mengalami serangan jantung mendadak dan meninggal dunia. Analisis fikih jinayah terhadap kasus ini adalah...", ["Bebas dari segala sanksi karena tidak terjadi sentuhan fisik sedikit pun", "Termasuk pembunuhan (qatl syibhul 'amdi atau 'amdi menurut sebagian ulama jika diketahui pasti mematikan) yang mewajibkan diyat dan kafarat", "Termasuk perbuatan bercanda yang dimaafkan secara hukum", "Dikenai had qadzaf 80 kali dera", "Hanya wajib meminta maaf kepada keluarga teman tersebut"], "B"],
      [109, "Seorang perampok mencegat pedagang di jalan sepi, merampas seluruh barang dagangannya, dan membunuh pedagang tersebut. Sebelum aparat keamanan berhasil menangkapnya, perampok tersebut datang menyerahkan diri kepada hakim dalam keadaan bertaubat dengan tulus. Berdasarkan QS. Al-Ma'idah ayat 34, dampak hukum dari taubatnya sebelum tertangkap adalah...", ["Ia bebas total dari hukuman mati maupun kewajiban mengembalikan harta", "Gugur hak Allah Swt. atas dirinya (hukuman salib/had hirabah gugur), tetapi hak manusia tetap berlaku sehingga ia wajib mengembalikan harta rampasan dan tetap menghadapi tuntutan qishas/diyat dari ahli waris korban", "Ia tetap wajib disalib namun tidak perlu mengembalikan harta korban", "Ahli waris korban dilarang menuntut qishas maupun diyat kepadanya", "Ia hanya wajib berpuasa selama satu bulan sebagai tanda taubat"], "B"],
      [110, "Seorang korban pembunuhan memiliki empat orang anak laki-laki sebagai ahli warisnya. Dalam persidangan kasus pembunuhan sengaja (qatl 'amdi), tiga orang anak menuntut agar pelaku dihukum qishas mati, sedangkan satu orang anak menyatakan memaafkan pelaku dan memilih diyat. Keputusan hukum Islam yang wajib dijalankan hakim adalah...", ["Tetap mengeksekusi qishas mati karena suara terbanyak (3 banding 1) menuntut qishas", "Hukuman qishas mati gugur secara otomatis karena pemaafan dari salah satu ahli waris saja sudah menggugurkan qishas, sehingga beralih kepada pembayaran diyat", "Pelaku dipenjara sambil menunggu keempat anak tersebut sepakat seratus persen", "Tiga perempat tubuh pelaku dilukai, sementara seperempatnya dimaafkan", "Keputusan diserahkan kepada kepala desa setempat"], "B"],
      [111, "Seseorang yang beragama Islam membaca buku-buku filsafat ateisme, lalu ia berkeyakinan dalam hatinya bahwa alam semesta ini terjadi dengan sendirinya tanpa adanya Tuhan Pencipta, meskipun ia belum pernah mengucapkannya kepada orang lain. Dalam klasifikasi jenis-jenis riddah dalam ilmu fikih, kondisi tersebut termasuk kategori...", ["Riddah bil-qaul (murtad melalui ucapan)", "Riddah bil-fi'li (murtad melalui perbuatan)", "Riddah bil-i'tiqad (murtad melalui keyakinan hati)", "Riddah bit-tark (murtad karena meninggalkan amal)", "Bughat pemikiran"], "C"],
      [112, "Hikmah besar di balik ketatnya syarat pembuktian tindak pidana zina dalam Islam yang mewajibkan kehadiran empat orang saksi laki-laki adil yang melihat kejadian secara langsung dan serentak adalah...", ["Untuk melegalkan perbuatan zina selama dilakukan di tempat tertutup", "Menjaga kehormatan dan nama baik manusia agar tidak mudah difitnah dengan tuduhan keji, sekaligus mendorong penutupan aib apabila pelaku bertaubat secara rahasia", "Karena pada masa lalu sulit menemukan empat orang yang bisa membaca dan menulis", "Agar pengadilan tidak terlalu sibuk mengurusi perkara moralitas masyarakat", "Untuk membebaskan seluruh pelaku zina dari hukuman dunia"], "B"],
      [113, "Dalam peradilan Islam, seorang tergugat yang menolak gugatan penggugat yang tidak memiliki saksi diwajibkan mengucapkan sumpah (yamin). Namun, tergugat tersebut justru menolak untuk bersumpah (nukul 'anil yamin) tanpa alasan yang jelas. Menurut pendapat mazhab Syafi'i, langkah lanjutan yang dilakukan hakim dalam sengketa harta tersebut adalah...", ["Langsung membatalkan gugatan dan memenangkan tergugat", "Mengembalikan hak bersumpah kepada penggugat (yamin mardudah); jika penggugat bersedia bersumpah atas kebenaran gugatannya, maka penggugat dimenangkan", "Memenjara tergugat seumur hidup sampai ia mau bersumpah", "Menghukum kedua belah pihak dengan cambukan 40 kali", "Menyita barang sengketa untuk kas pengadilan"], "B"],
      [114, "Seorang hakim menerima permohonan pengajuan eksekusi qishas atas kasus pembunuhan sengaja. Namun, setelah diteliti, terpidana pembunuhan tersebut ternyata seorang wanita yang sedang dalam kondisi hamil tua. Berdasarkan prinsip kemanusiaan dalam peradilan Islam, keputusan hakim terkait waktu eksekusi adalah...", ["Tetap mengeksekusi terpidana segera agar ahli waris korban tidak kecewa", "Menunda eksekusi qishas hingga wanita tersebut melahirkan dan selesai masa penyusuan bayinya agar janin yang tidak berdosa tidak ikut terbunuh", "Mengganti terpidana dengan suaminya untuk dieksekusi qishas", "Membebaskan terpidana dari qishas maupun diyat secara permanen", "Mempercepat proses persalinan secara paksa sebelum eksekusi"], "B"],
      [115, "Seseorang mencuri perhiasan emas seberat 4 gram milik tetangganya dengan cara memanjat pagar dan mencongkel jendela rumah pada malam hari. Setelah tertangkap, ternyata pelaku adalah saudara kandung dari pemilik rumah tersebut. Menurut pendapat jumhur ulama (Syafi'iyah dan Hanabilah), apakah pelaku tetap dikenai had potong tangan?", ["Tidak dipotong tangan karena masih memiliki hubungan keluarga dekat", "Tetap dikenai had potong tangan karena hubungan saudara kandung (selain jalur orang tua-anak/suami-istri) tidak menimbulkan syubhat kepemilikan harta", "Bebas dari segala hukuman karena mencuri harta kerabat sendiri", "Dikenai hukuman dera 80 kali sebagai pengganti potong tangan", "Wajib menikahi saksi yang menangkapnya"], "B"],
      [116, "Seseorang memaksa orang lain dengan ancaman senjata api untuk melompat dari jembatan tinggi ke sungai yang berarus sangat deras dan berbatu, padahal korban diketahui tidak bisa berenang. Korban pun melompat karena takut ditembak dan akhirnya tewas tenggelam. Dalam analisis fikih jinayah, pelaku pemaksaan tersebut dihukumi sebagai pelaku...", ["Qatl khata' karena korban melompat sendiri ke sungai", "Qatl 'amdi (pembunuhan sengaja) yang wajib diqishas mati karena ia memaksa korban melakukan tindakan yang pasti membinasakannya", "Qatl syibhul 'amdi karena tidak menyentuh tubuh korban", "Bughat karena mengancam dengan senjata api", "Tidak bersalah karena korban memiliki pilihan untuk tidak melompat"], "B"],
      [117, "Seorang Muslim secara sadar dan tanpa paksaan melempar mushaf Al-Qur'an ke tempat kotoran dengan maksud menghina dan merendahkan kesucian firman Allah Swt. Meskipun ia tidak mengucapkan kalimat keluar dari Islam, perbuatannya tersebut dalam fikih dikategorikan sebagai...", ["Kenakalan biasa yang cukup ditegur secara kekeluargaan", "Riddah bil-fi'li (kemurtadan melalui perbuatan) karena perbuatan tersebut merupakan bentuk pelecehan nyata terhadap syiar suci Islam", "Nifaq 'amali ringan yang tidak membatalkan keislaman", "Qadzaf terhadap umat Islam", "Pelanggaran adab membaca Al-Qur'an biasa"], "B"],
      [118, "Dalam kasus pembunuhan sengaja (qatl 'amdi) yang telah dimaafkan oleh ahli waris korban, pelaku wajib membayar diyat mughalladzah sebesar 100 ekor unta. Apabila di suatu negara atau masa tertentu unta sulit ditemukan atau tidak digunakan sebagai alat tukar, jumhur ulama menetapkan bahwa diyat tersebut dapat dibayarkan dalam bentuk nilai tukar uang yang setara dengan harga unta tersebut atau berdasarkan standar emas/perak, yaitu sebesar...", ["100 dinar emas atau 1.000 dirham perak", "500 dinar emas atau 5.000 dirham perak", "1.000 dinar emas atau 12.000 dirham perak (menurut pendapat mayoritas fuqaha)", "50 dinar emas atau 500 dirham perak", "2.000 dinar emas atau 24.000 dirham perak"], "C"],
      [119, "Dalam suatu persidangan, penggugat menyerahkan dokumen perjanjian tertulis sebagai alat bukti, namun tergugat menyangkal keaslian tanda tangan di dalam dokumen tersebut. Untuk memastikan kebenaran alat bukti tersebut, hakim memanggil ahli forensik tulisan tangan (khabir) untuk memeriksanya. Kedudukan keterangan ahli dalam peradilan Islam berfungsi sebagai...", ["Pengganti kedudukan hakim dalam menjatuhkan vonis akhir", "Qarinah (indikasi/petunjuk kuat) yang membantu hakim mengungkap kebenaran materiil secara ilmiah dan objektif", "Alat bukti yang lebih tinggi derajatnya daripada Al-Qur'an dan Hadis", "Saksi utama yang wajib mengucapkan sumpah li'an", "Alasan untuk menolak seluruh gugatan penggugat secara otomatis"], "B"],
      [120, "Seorang pemuda menuduh temannya melakukan perbuatan zina di sebuah grup percakapan media sosial yang beranggotakan ratusan orang tanpa memiliki bukti empat orang saksi. Setelah dilaporkan ke pengadilan, korban tuduhan (maqdzuf) menyatakan memaafkan pelaku sebelum perkara diputus oleh hakim. Menurut pendapat jumhur ulama (Syafi'iyah dan Hanabilah), status had qadzaf bagi pelaku adalah...", ["Tetap wajib dicambuk 80 kali karena qadzaf murni hak Allah yang tidak bisa dimaafkan manusia", "Gugur hukuman had qadzaf-nya karena dalam qadzaf terdapat dominasi hak manusia (haqqul adami) menyangkut kehormatan korban yang dapat digugurkan dengan pemaafan korban", "Diganti dengan hukuman potong tangan", "Pelaku wajib membayar diyat 100 ekor unta kepada admin grup media sosial", "Hukumannya dikurangi menjadi 40 kali dera"], "B"],
      [121, "Seorang perampok bersenjata menyergap rombongan musafir di jalan raya, membunuh salah seorang musafir, namun sebelum ia sempat mengambil harta benda rombongan tersebut, petugas patroli datang dan langsung menangkapnya. Berdasarkan ketentuan QS. Al-Ma'idah ayat 33 menurut jumhur ulama, sanksi had yang dijatuhkan kepada perampok tersebut adalah...", ["Dibunuh dan disalib karena telah membunuh korban", "Dibunuh (dihukum mati) tanpa disalib, karena ia telah membunuh korban namun belum sempat mengambil hartanya", "Dipotong tangan kanan dan kaki kirinya secara bersilang", "Diasingkan selama satu tahun tanpa hukuman mati", "Dibebaskan karena harta musafir masih utuh"], "B"],
