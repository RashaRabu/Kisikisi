      [122, "Salah satu asas fundamental dalam peradilan Islam adalah Al-Ashlu bara'atudz-dzimmah (pada asalnya setiap orang bebas dari tanggungan/kesalahan sampai ada bukti sah yang menyalahkannya). Implementasi konkret dari asas ini dalam proses persidangan adalah...", ["Terdakwa wajib membuktikan dirinya tidak bersalah meskipun tidak ada bukti dari penuntut", "Beban pembuktian utama dibebankan kepada pihak penuntut/penggugat (muddai), dan terdakwa berhak mendapatkan perlindungan hukum selama belum terbukti bersalah", "Hakim boleh menghukum terdakwa berdasarkan prasangka masyarakat luas", "Setiap orang yang dilaporkan ke pengadilan otomatis dianggap bersalah", "Terdakwa tidak diperbolehkan melakukan pembelaan diri di hadapan hakim"], "B"],
      [123, "Sekelompok warga di sebuah daerah membuat gerakan separatis bersenjata dengan alasan bahwa kepala negara yang sah tidak berasal dari suku mereka. Setelah pemerintah mengirim utusan untuk berdialog dan menjelaskan dalil-dalil syariat bahwa kepemimpinan tidak dibatasi oleh suku tertentu, sebagian besar anggota kelompok tersebut sadar dan meletakkan senjata. Sikap pemerintah yang tepat terhadap anggota yang telah menyerah tersebut adalah...", ["Tetap membunuh seluruh mantan anggota gerakan tersebut sebagai tindakan pencegahan", "Menerima mereka kembali sebagai warga negara yang sah, melindungi jiwa dan harta mereka, serta tidak menghukum mereka atas tindakan masa lalu setelah mereka taat", "Menjadikan mereka sebagai pekerja paksa seumur hidup tanpa upah", "Merampas seluruh tanah pertanian milik mereka untuk dibagikan kepada tentara", "Mengusir mereka keluar dari wilayah negara"], "B"],
      [124, "Seseorang meletakkan racun mematikan di dalam makanan yang disiapkan untuk tamu undangannya dengan tujuan membunuh tamu tersebut. Namun, tamu undangan tersebut tidak memakan makanan itu, melainkan seorang anak kecil yang masuk ke dapur tanpa sepengetahuan pemilik rumah memakan makanan beracun tersebut hingga meninggal dunia. Menurut analisis fikih jinayah, pelaku tetap dikategorikan sebagai pelaku...", ["Qatl khata' murni karena target awalnya bukan anak kecil tersebut", "Qatl 'amdi (pembunuhan sengaja) karena perbuatan meletakkan racun mematikan dilakukan dengan niat membunuh jiwa manusia yang dilindungi darahnya (error in persona tidak menghilangkan unsur kesengajaan membunuh)", "Tidak bersalah sama sekali karena anak kecil itu masuk dapur tanpa izin", "Qatl syibhul 'amdi yang hanya mewajibkan puasa tiga hari", "Pelanggaran ringan yang cukup diselesaikan dengan mengganti biaya pemakaman"], "B"],
      [125, "Dalam sebuah sengketa jual beli, kedua belah pihak sepakat menunjuk seorang ulama atau tokoh terpercaya di luar pengadilan resmi untuk menyelesaikan perselisihan mereka secara damai dan adil berdasarkan hukum Islam, dan keduanya berkomitmen mematuhi keputusannya. Lembaga penyelesaian sengketa non-litigasi semacam ini dalam fikih peradilan Islam dikenal dengan istilah...", ["Tahkim (arbitrase Islam)", "Mazhalim", "Hisbah", "Qasamah", "Li'an"], "A"],
      [126, "Mengapa syariat Islam menetapkan hukuman qishas bagi pelaku pembunuhan sengaja (qatl 'amdi), namun pada saat yang sama sangat menganjurkan ahli waris korban untuk memaafkan pelaku dengan mengambil diyat atau bahkan bersedekah membebaskan diyat (QS. Al-Baqarah: 178)?", ["Karena hukum qishas sudah tidak relevan untuk diterapkan pada masyarakat modern", "Untuk memadukan tegaknya keadilan dan efek jera (melindungi hak hidup masyarakat) dengan nilai kasih sayang, perdamaian, dan memutus rantai dendam antarkeluarga", "Agar pelaku pembunuhan dapat menebus dosanya hanya dengan kekayaan harta benda", "Karena ahli waris korban selalu membutuhkan dana tunai untuk biaya hidup", "Untuk melemahkan wibawa lembaga peradilan negara"], "B"],
      [127, "Seseorang mengambil barang milik orang lain dari sebuah brankas terbuka di ruang tamu secara terang-terangan di hadapan pemiliknya lalu langsung berlari kabur (ikhtilas/jambret) tanpa menggunakan senjata atau ancaman kekerasan. Dalam kajian fikih jinayah menurut jumhur ulama, pelaku penjambretan tersebut dikenai sanksi...", ["Had potong tangan sebagaimana pencuri (sariq)", "Had salib sebagaimana perampok (muharib)", "Hukuman ta'zir yang berat serta wajib mengembalikan barang rampasan, karena tidak memenuhi syarat pencurian (khufyah/sembunyi-sembunyi dari tempat tertutup) maupun hirabah (penggunaan senjata/kekuatan)", "Had dera 80 kali sebagaimana qadzaf", "Dibebaskan karena pemilik barang melihat langsung saat barangnya diambil"], "C"],
      [128, "Seseorang yang telah menikah secara sah (muhshan) melakukan perzinaan, namun sebelum kasusnya dilaporkan ke hakim dan sebelum ada saksi yang mengetahuinya, ia menyesal dengan sangat mendalam, menangis memohon ampun kepada Allah Swt., serta memperbaiki seluruh amal ibadahnya secara rahasia. Berdasarkan petunjuk Nabi Saw., tindakan yang paling tepat bagi orang tersebut adalah...", ["Datang ke pengadilan dan mengumumkan perbuatannya di depan media massa", "Menutup rapat aib dirinya, tidak menceritakan dosanya kepada siapa pun, dan bersungguh-sungguh dalam taubat nasuha kepada Allah Swt.", "Mencambuk dirinya sendiri sebanyak 100 kali di dalam kamar", "Menceraikan pasangannya secara sepihak tanpa alasan jelas", "Membayar diyat 100 ekor unta kepada pengurus masjid setempat"], "B"],
      [129, "Seseorang secara sadar mengucapkan kalimat yang menghina salah satu rukun iman dan menyatakan tidak lagi mempercayai hari kebangkitan setelah mati. Setelah dinasihati dan diberi waktu tiga hari untuk bertaubat (istitabah), ia tetap teguh pada kekufurannya dan menolak kembali kepada Islam. Konsekuensi hukum perdata Islam terhadap status pernikahannya dengan istrinya yang Muslimah adalah...", ["Pernikahannya tetap sah dan berlanjut seperti biasa tanpa perubahan apa pun", "Pernikahannya terputus (fasakh) secara hukum Islam karena haram hukumnya wanita Muslimah bersuamikan laki-laki yang murtad/kafir", "Istrinya wajib ikut murtad demi mematuhi perintah suami", "Suami tetap berhak mendapatkan harta warisan apabila istrinya meninggal dunia", "Pernikahan ditangguhkan selama sepuluh tahun tanpa nafkah"], "B"],
      [130, "Seorang hakim menjatuhkan hukuman ta'zir kepada seorang pejabat daerah yang terbukti melakukan korupsi dana bantuan sosial fakir miskin. Bentuk hukuman ta'zir yang dapat dijatuhkan oleh hakim menurut syariat Islam adalah...", ["Wajib berupa potong tangan kanan dan kaki kiri secara bersilang", "Bersifat fleksibel sesuai tingkat kejahatan dan kemaslahatan (seperti pemecatan dari jabatan, penyitaan seluruh harta hasil korupsi, denda finansial, penjara, dan pengumuman ke publik)", "Wajib berupa hukum rajam di lapangan terbuka", "Wajib berupa membayar kafarat puasa dua bulan berturut-turut", "Hakim tidak berwenang menghukumnya karena korupsi tidak disebutkan secara harfiah dalam nash hudud"], "B"],
      [131, "Dalam suatu persidangan, ditemukan mayat seseorang di sebuah perkampungan tertutup dengan tanda-tanda bekas pembunuhan, namun tidak ada satu pun saksi mata yang melihat pelakunya dan tidak ada yang mengaku. Penduduk kampung menuduh seseorang yang memiliki permusuhan dengan korban. Dalam fikih jinayah, mekanisme pembuktian sumpah khusus sebanyak 50 kali yang dilakukan oleh keluarga korban untuk menguatkan tuduhan pembunuhan tersebut disebut...", ["Li'an", "Qasamah", "Zihar", "Ila'", "Tahkim"], "B"],
      [132, "Dua orang sahabat sedang bercanda dengan saling mengarahkan senapan angin yang dikira kosong tanpa peluru. Ketika salah seorang menarik pelatuknya, ternyata masih ada sebutir peluru tertinggal di dalam laras yang langsung melesat mengenai dada sahabatnya hingga meninggal dunia. Berdasarkan analisis niat dan kejadiannya, peristiwa ini dikategorikan sebagai...", ["Qatl 'amdi karena menggunakan senapan angin", "Qatl khata' (pembunuhan tersalah/kelalaian) karena sama sekali tidak ada niat melukai maupun membunuh, namun tetap mewajibkan kafarat dan diyat ringan", "Hirabah karena menggunakan senjata api/angin", "Peristiwa mubah yang tidak menimbulkan kewajiban kafarat", "Qatl syibhul 'amdi yang mewajibkan hukuman mati"], "B"],
      [133, "Seorang peminum khamar yang telah dijatuhi hukuman had dera oleh pengadilan kembali mengulangi perbuatannya meminum khamar untuk keempat kalinya setelah sebelumnya telah dihukum tiga kali. Menurut pendapat jumhur ulama (termasuk Imam Syafi'i, Malik, dan Abu Hanifah), hukuman yang dijatuhkan kepadanya pada kali keempat tersebut adalah...", ["Wajib dibunuh sebagai had yang pasti", "Tetap dikenai had dera khamar (40 atau 80 kali) dan dapat ditambah hukuman ta'zir yang lebih berat oleh hakim karena hadis tentang membunuh peminum khamar pada kali keempat telah di-mansukh (dihapus hukumnya)", "Dipotong tangan kanannya", "Diasingkan keluar negeri selama sepuluh tahun", "Dibebaskan karena dianggap sudah kecanduan berat"], "B"],
      [134, "Seorang laki-laki memotong lidah orang lain dengan sengaja hingga korban menjadi bisu total dan kehilangan kemampuan berbicara selamanya. Apabila korban memilih menuntut diyat sebagai pengganti qishas, besaran diyat yang wajib dibayarkan pelaku adalah...", ["Seperempat diyat penuh", "Setengah diyat penuh (50 ekor unta)", "Satu diyat penuh (100 ekor unta) karena lidah merupakan organ tunggal yang memiliki fungsi vital (berbicara) yang hilang seluruhnya", "Sepuluh ekor unta", "Tiga puluh ekor unta"], "C"],
      [135, "Dalam sejarah Islam, Khalifah Abu Bakar Ash-Siddiq r.a. memerangi kelompok-kelompok yang menolak membayar zakat sepeninggal Rasulullah Saw. karena mereka membentuk kekuatan bersenjata, mengingkari kewajiban zakat sebagai rukun Islam, dan memberontak terhadap negara. Hikmah utama dari ketegasan Khalifah Abu Bakar r.a. tersebut bagi keutuhan negara dan agama adalah...", ["Menunjukkan bahwa pemimpin negara berhak merampas harta rakyat kapan saja", "Menjaga keutuhan syariat Islam agar tidak dipilah-pilah (antara salat dan zakat) serta melindungi stabilitas keamanan negara dari disintegrasi bersenjata", "Menghukum seluruh kabilah Arab agar takut kepada penduduk Madinah", "Mengumpulkan harta kekayaan sebanyak-banyaknya untuk memperluas istana negara", "Menghapuskan sistem musyawarah dalam pemerintahan Islam"], "B"],
      [136, "Seorang wanita Muslimah diperkosa secara paksa di bawah ancaman senjata tajam oleh seorang pria. Setelah kejadian tersebut, wanita itu segera melapor kepada hakim dengan membawa bukti fisik dan medis. Bagaimana kedudukan hukum wanita tersebut menurut fikih jinayah?", ["Ia tetap dikenai had zina karena telah terjadi hubungan di luar nikah", "Ia terbebas sepenuhnya dari had zina maupun dosa karena berstatus sebagai korban paksaan (mukrahah), sedangkan pelaku pemerkosaan dijatuhi hukuman had zina (dan dapat ditambah ta'zir berat/hukuman hirabah karena unsur kekerasan)", "Ia wajib didera 50 kali sebagai bentuk pembersihan diri", "Ia wajib dinikahkan dengan pelaku pemerkosaan tersebut", "Kesaksian dan laporannya ditolak kecuali ia menghadirkan empat orang saksi mata"], "B"],
      [137, "Dalam hierarki lembaga peradilan Islam klasik, terdapat lembaga khusus yang berwenang mengadili sengketa atau kezaliman yang dilakukan oleh para pejabat tinggi negara, gubernur, atau keluarga penguasa terhadap rakyat biasa agar rakyat kecil mendapatkan keadilan tanpa rasa takut. Lembaga peradilan khusus ini dikenal dengan istilah...", ["Wilayatul Hisbah", "Wilayatul Mazhalim", "Baitul Mal", "Majelis Syura", "Diwanul Jund"], "B"],
      [138, "Seorang pencuri yang telah divonis potong tangan oleh hakim ternyata sudah tidak memiliki tangan kanan sejak lahir (cacat bawaan). Menurut pendapat mayoritas ulama fikih (Hanafiyah dan Hanabilah), pelaksanaan had potong tangan bagi pencuri tersebut adalah...", ["Dipotong tangan kirinya sebagai pengganti tangan kanan", "Dipotong kaki kirinya secara langsung", "Gugur kewajiban potong tangan karena anggota tubuh yang menjadi objek had pertama (tangan kanan) sudah tidak ada, sehingga beralih kepada hukuman ta'zir yang setimpal", "Tetap dipotong bahu kanannya sampai siku", "Dikenai hukuman rajam"], "C"],
      [139, "Seseorang melakukan pembunuhan tersalah (qatl khata'), namun setelah diperiksa ternyata ia tidak memiliki harta sedikit pun untuk memerdekakan hamba sahaya dan keluarga besarnya ('aqilah) juga tergolong fakir miskin. Dalam kondisi demikian, kewajiban kafarat yang harus ia jalankan sebagai bentuk taubat kepada Allah Swt. adalah...", ["Membayar kafarat dengan cara memberi makan 10 orang miskin", "Berpuasa selama dua bulan berturut-turut tanpa terputus kecuali karena uzur syar'i (QS. An-Nisa': 92)", "Berpuasa selama tiga hari di bulan Ramadan", "Membaca istigfar 1.000 kali tanpa perlu berpuasa", "Bebas dari kewajiban kafarat secara mutlak"], "B"],
      [140, "Berdasarkan keseluruhan kajian materi jinayah, hudud, bughat, riddah, dan peradilan Islam, benang merah filosofis yang menjadi tujuan utama (maqashid syariah) ditetapkannya sanksi hukum pidana Islam adalah...", ["Melampiaskan kemarahan penguasa dan menciptakan ketakutan di tengah masyarakat", "Melindungi lima kebutuhan dasar manusia (al-kulliyyat al-khams: agama, jiwa, akal, keturunan, dan harta) demi terwujudnya kedamaian, keadilan, dan kemaslahatan umat manusia", "Mengurangi jumlah populasi manusia melalui hukuman mati", "Memperkaya kas negara melalui denda dan penyitaan harta terpidana", "Membedakan perlakuan hukum antara golongan bangsawan dan rakyat jelata"], "B"]
    ];

    let showAnswers = true;

    function toggleShowAnswers() {
      showAnswers = !showAnswers;
      const btn = document.getElementById('toggle-ans-btn');
      const icon = document.getElementById('toggle-ans-icon');
      const text = document.getElementById('toggle-ans-text');

      if (showAnswers) {
        btn.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-emerald-500/15 text-emerald-300 border border-emerald-500/30 hover:bg-emerald-500/25 transition flex items-center gap-1.5';
        icon.textContent = '👁️';
        text.textContent = 'Kunci Ditampilkan';
      } else {
        btn.className = 'px-3.5 py-2 rounded-xl text-xs font-bold bg-slate-800 text-slate-300 border border-slate-700 hover:bg-slate-700 transition flex items-center gap-1.5';
        icon.textContent = '🙈';
        text.textContent = 'Kunci Disembunyikan';
      }
      renderList();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      renderList();
    }

    function jumpToNo() {
      const val = parseInt(document.getElementById('jump-input').value, 10);
      if (!val || val < 1 || val > 140) return;
      document.getElementById('bab-filter').value = 'all';
      document.getElementById('search-input').value = '';
      renderList();
      setTimeout(() => {
        const el = document.getElementById(`soal-${val}`);
        if (el) {
          el.scrollIntoView({ behavior: 'smooth', block: 'center' });
          el.classList.add('ring-2', 'ring-emerald-400');
          setTimeout(() => el.classList.remove('ring-2', 'ring-emerald-400'), 1800);
        }
      }, 50);
    }

    function renderList() {
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const babFilter = document.getElementById('bab-filter').value;
      const clearBtn = document.getElementById('clear-search');
      clearBtn.classList.toggle('hidden', query === '');

      const letters = ['A', 'B', 'C', 'D', 'E'];
      const container = document.getElementById('questions-container');
      container.innerHTML = '';

      let matchCount = 0;

      rawQuestions.forEach(([no, qText, options, ansLetter]) => {
        const bab = getBabInfo(no);
        if (babFilter !== 'all' && bab.key !== babFilter) return;

        if (query !== '') {
          const isExactNum = /^\d+$/.test(query) && String(no) === query;
          const matchesText =
            String(no).includes(query) ||
            qText.toLowerCase().includes(query) ||
            options.some(opt => opt.toLowerCase().includes(query));
          if (!isExactNum && !matchesText) return;
        }

        matchCount++;
        const ansIndex = letters.indexOf(ansLetter);

        const card = document.createElement('article');
        card.id = `soal-${no}`;
        card.className = 'bg-slate-900/90 rounded-2xl border border-slate-800 p-5 sm:p-6 shadow-md transition-all duration-300 space-y-4';

        // Header row
        const headerHTML = `
          <div class="flex items-center justify-between gap-2 flex-wrap">
            <div class="flex items-center gap-2.5">
              <span class="px-3 py-1 rounded-lg bg-slate-800 text-slate-100 font-extrabold text-xs sm:text-sm border border-slate-700">
                Soal #${no}
              </span>
              <span class="px-2.5 py-1 rounded-lg text-xs font-bold border ${bab.color}">
                ${bab.label}
              </span>
            </div>
            ${showAnswers ? `
              <span class="px-3 py-1 rounded-full bg-emerald-500/20 border border-emerald-500/40 text-emerald-300 text-xs font-extrabold">
                ✓ Kunci: ${ansLetter}
              </span>
            ` : `
              <button onclick="revealSingle(${no})" class="px-3 py-1 rounded-full bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-300 text-xs font-bold transition">
                Lihat Kunci
              </button>
            `}
          </div>
        `;

        // Options list
        const optionsHTML = options.map((opt, idx) => {
          const isCorrect = idx === ansIndex;
          const highlight = showAnswers && isCorrect;
          return `
            <div data-opt-no="${no}" data-opt-correct="${isCorrect}" class="opt-row flex items-start gap-3 p-3 rounded-xl border text-xs sm:text-sm transition ${
              highlight
                ? 'bg-emerald-500/15 border-emerald-500/50 text-emerald-100 font-semibold'
                : 'bg-slate-950/60 border-slate-800/90 text-slate-300'
            }">
              <span class="w-6 h-6 rounded-md flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 ${
                highlight
                  ? 'bg-emerald-500 text-slate-950'
                  : 'bg-slate-800 text-slate-400 border border-slate-700'
              }">
                ${letters[idx]}
              </span>
              <span class="leading-relaxed">${opt}</span>
            </div>
          `;
        }).join('');

        card.innerHTML = `
          ${headerHTML}
          <p class="text-sm sm:text-base font-bold text-slate-50 leading-relaxed">${qText}</p>
          <div class="space-y-2">${optionsHTML}</div>
        `;

        container.appendChild(card);
      });

      document.getElementById('result-count').textContent = `Menampilkan ${matchCount} dari 140 soal`;

      if (matchCount === 0) {
        container.innerHTML = `
          <div class="text-center py-14 bg-slate-900/60 rounded-2xl border border-slate-800 space-y-2">
            <div class="text-3xl">🔎</div>
            <p class="font-bold text-slate-200">Soal tidak ditemukan</p>
            <p class="text-xs text-slate-400">Coba kata kunci lain atau reset filter bab di atas.</p>
          </div>
        `;
      }
    }

    function revealSingle(no) {
      const rows = document.querySelectorAll(`[data-opt-no="${no}"]`);
      rows.forEach(row => {
        if (row.dataset.optCorrect === 'true') {
          row.className = 'opt-row flex items-start gap-3 p-3 rounded-xl border text-xs sm:text-sm transition bg-emerald-500/15 border-emerald-500/50 text-emerald-100 font-semibold';
          const badge = row.querySelector('span');
          badge.className = 'w-6 h-6 rounded-md flex items-center justify-center text-xs font-extrabold shrink-0 mt-0.5 bg-emerald-500 text-slate-950';
        }
      });
    }

    window.onload = function() {
      renderList();
    };
  </script>
</body>
</html>
